<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ο άνθρωπος ανάμεσα στη φύση, τη γλώσσα και το άγνωστο</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=GFS+Didot&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--ink:#ece4d3;--dim:#8f897c;--line:#26252a;--ac:#8fc1b5;
--serif:'EB Garamond','Palatino Linotype',Georgia,serif;--disp:'GFS Didot','Didot','Bodoni 72',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden}
body{background-image:
radial-gradient(circle at 12% 18%,#ffffff55 0 1px,transparent 1.5px),
radial-gradient(circle at 78% 12%,#ffffff40 0 1px,transparent 1.5px),
radial-gradient(circle at 34% 72%,#ffffff33 0 1px,transparent 1.5px),
radial-gradient(circle at 91% 58%,#ffffff44 0 1px,transparent 1.5px),
radial-gradient(circle at 56% 90%,#ffffff30 0 1px,transparent 1.5px),
radial-gradient(circle at 6% 84%,#ffffff40 0 1px,transparent 1.5px),
radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--ac) 10%,transparent),transparent 60%)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
padding:max(64px,env(safe-area-inset-top)) clamp(24px,8vw,140px) max(96px,env(safe-area-inset-bottom))}
.slide{width:100%;max-width:62rem;max-height:100%;overflow:auto;scrollbar-width:none;animation:in .45s ease both}
.slide::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.slide p,.slide h1,.slide h2,.q{font-weight:400}
/* sizing steps */
.sz1{font-size:clamp(1.7rem,3.8vw,3.4rem)}.sz2{font-size:clamp(1.5rem,3.2vw,2.8rem)}
.sz3{font-size:clamp(1.25rem,2.5vw,2.2rem)}.sz4{font-size:clamp(1.1rem,2.05vw,1.8rem)}
.slide p{line-height:1.38;margin-bottom:.55em}
.slide p.b{border-left:2px solid var(--ac);padding-left:.7em;margin-left:-.7em}
.slide b{font-weight:500;color:#fff}.slide i{color:var(--ac)}
/* title / section */
.k-title h1,.k-coll h2{font-family:var(--disp);font-size:clamp(2.2rem,6vw,5.4rem);line-height:1.08;letter-spacing:-.01em}
.k-title .sub,.k-coll .sub{margin-top:1.6rem;color:var(--dim);font-style:italic;font-size:clamp(1rem,1.6vw,1.35rem)}
.k-sec{display:flex;align-items:baseline;gap:clamp(1rem,3vw,2.6rem)}
.k-sec .n{font-family:var(--disp);font-size:clamp(5rem,16vw,13rem);line-height:.8;color:var(--ac);opacity:.9}
.k-sec h2{font-family:var(--disp);font-size:clamp(1.8rem,4.2vw,3.7rem);line-height:1.12}
/* aphorism */
.k-aph .meta{display:flex;justify-content:space-between;gap:1rem;color:var(--dim);font-style:italic;font-size:1.05rem;margin-bottom:2.2rem;padding-bottom:.8rem;border-bottom:1px solid var(--line)}
.k-aph .meta span:last-child{color:var(--ac);font-style:normal;font-variant-numeric:tabular-nums}
.q{line-height:1.3}
/* cipher */
.ci{display:block}.ci .w{display:inline-flex;white-space:nowrap;margin-right:.45em;align-items:center}
.ci img{width:1.12em;height:1.12em;margin:0 -.05em;mix-blend-mode:screen;opacity:.86;display:block}
.ci .pu{color:var(--dim);font-size:.7em;padding:0 .08em;font-family:var(--serif)}
.k-title .ci,.k-sec .ci,.k-coll .ci{line-height:1}
.k-title .ci img{width:1.1em;height:1.1em}
.b .ci img,.b.ci img{opacity:1}
[data-mode=greek] .ci{display:none}
[data-mode=cipher] .gr{display:none}
[data-mode=both] .ci{font-size:.62em;margin-bottom:.35em}
[data-mode=both] .gr{font-size:.5em;color:var(--dim)}
[data-mode=both] .k-title .gr,[data-mode=both] .k-sec .gr,[data-mode=both] .k-coll .gr{font-size:.4em}
.lab{position:fixed;top:max(22px,env(safe-area-inset-top));left:clamp(24px,4vw,56px);right:clamp(24px,4vw,56px);display:flex;justify-content:space-between;
gap:1rem;color:var(--dim);font-style:italic;font-size:1rem;pointer-events:none}
.lab span:last-child{font-style:normal;font-variant-numeric:tabular-nums}
/* controls */
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:1rem;
padding:14px clamp(16px,4vw,56px) max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#09090bcc 55%)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
button{font:inherit;color:var(--dim);background:none;border:0;cursor:pointer;transition:color .2s,background .2s}
.seg button{padding:.45rem 1rem;font-size:.98rem}
.seg button:hover,.ic:hover{color:var(--ink)}
.seg button.on{background:var(--ac);color:#0b0b0d}
.nav{display:flex;gap:.3rem;align-items:center}
.ic{width:42px;height:42px;border-radius:50%;font-size:1.3rem;border:1px solid var(--line);display:grid;place-items:center}
.ic:focus-visible,.seg button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#orbit{position:fixed;right:-9vmin;bottom:-9vmin;width:36vmin;height:36vmin;opacity:.55;pointer-events:none}
/* index */
#idx{position:fixed;inset:0;background:#09090bf2;display:none;overflow:auto;padding:clamp(24px,6vw,80px);z-index:5}
#idx.open{display:block}
#idx ol{list-style:none;max-width:44rem;margin:0 auto;columns:1}
#idx li button{width:100%;text-align:left;padding:.65rem 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:1.2rem;display:flex;justify-content:space-between;gap:1rem}
#idx li button:hover{color:var(--ac)}#idx li button span{color:var(--dim);font-variant-numeric:tabular-nums}
#idx li.cur button{color:var(--ac)}
@media(max-width:560px){.seg button{padding:.4rem .6rem;font-size:.9rem}.k-sec{flex-direction:column;gap:.4rem}}
@media(prefers-reduced-motion:reduce){.slide{animation:none}}
</style>
</head>
<body data-mode="both">
<div class="lab"><span id="l1"></span><span id="l2"></span></div>
<main id="stage" aria-live="polite"></main>
<svg id="orbit" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="#ece4d3" stroke-opacity=".35" stroke-width=".4"/><circle cx="50" cy="50" r="30" fill="none" stroke="#ece4d3" stroke-opacity=".18" stroke-width=".3" stroke-dasharray="1 2"/><circle id="pl" r="1.8" fill="var(--ac)"/></svg>
<div class="bar">
  <div class="seg" role="group" aria-label="Display mode">
    <button data-m="greek">Greek</button><button data-m="cipher">Cipher</button><button data-m="both" class="on">Both</button>
  </div>
  <div class="nav">
    <button class="ic" id="bi" title="Contents (G)" aria-label="Contents">☰</button>
    <button class="ic" id="bpl" title="Pause / play (Space)" aria-label="Pause or play">⏸</button>
    <button class="ic" id="bp" title="Previous (←)" aria-label="Previous">←</button>
    <button class="ic" id="bn" title="Next (→)" aria-label="Next">→</button>
    <button class="ic" id="bf" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button>
  </div>
</div>
<div id="idx"><ol id="il"></ol></div>
<script>
var S=[{"k":"title","t":"Ο άνθρωπος ανάμεσα στη φύση, τη γλώσσα και το άγνωστο","th":0},{"k":"text","l":"Εισαγωγή","th":0,"ls":["Υπάρχει μια παράξενη αντίφαση στην ανθρώπινη ύπαρξη. Από τη μία πλευρά, ο άνθρωπος είναι ένα πλάσμα που θέλει να γνωρίζει."]},{"k":"text","l":"Εισαγωγή","th":0,"ls":["Θέλει να ονομάζει τα πράγματα, να τα ταξινομεί, να ανακαλύπτει τους νόμους που τα διέπουν, να κατασκευάζει εργαλεία και να προβλέπει το μέλλον."]},{"k":"text","l":"Εισαγωγή","th":0,"ls":["Από την άλλη, όσο περισσότερο γνωρίζει, τόσο περισσότερο αντιλαμβάνεται το μέγεθος εκείνων που δεν γνωρίζει.","Ίσως αυτή να είναι μία από τις βαθύτερες συνθήκες της ανθρώπινης ζωής: **η γνώση δεν εξαφανίζει το άγνωστο· συχνά το μεγαλώνει.**"]},{"k":"text","l":"Εισαγωγή","th":0,"ls":["Η επιστήμη μάς έδωσε τη δυνατότητα να κοιτάξουμε μέσα στην ύλη και έξω από τον πλανήτη μας. Η τεχνολογία μάς έδωσε δύναμη που καμία προηγούμενη γενιά ανθρώπων δεν διέθετε."]},{"k":"text","l":"Εισαγωγή","th":0,"ls":["Η γλωσσολογία μάς έκανε να καταλάβουμε ότι ο τρόπος με τον οποίο μιλάμε επηρεάζει τον τρόπο με τον οποίο αντιλαμβανόμαστε την πραγματικότητα."]},{"k":"text","l":"Εισαγωγή","th":0,"ls":["Η ηθική μάς υπενθυμίζει ότι το γεγονός πως *μπορούμε* να κάνουμε κάτι δεν σημαίνει ότι *πρέπει* να το κάνουμε."]},{"k":"text","l":"Εισαγωγή","th":0,"ls":["Και ο πραγματισμός μάς αναγκάζει να επιστρέψουμε από τις αφηρημένες βεβαιότητες στην πραγματική ζωή: στις συνέπειες των πράξεών μας, στις σχέσεις μας, στις ανάγκες μας και στον κόσμο μέσα στον οποίο υπάρχουμε."]},{"k":"text","l":"Εισαγωγή","th":0,"ls":["Και πάνω από όλα αυτά υπάρχει ένα ερώτημα σχεδόν κοσμικό:","**Είμαστε μόνοι;**"]},{"k":"sec","n":"1","t":"Ο πραγματισμός και η αλήθεια που δοκιμάζεται στη ζωή","th":0},{"k":"text","l":"Ο πραγματισμός και η αλήθεια που δοκιμάζεται στη ζωή","th":0,"ls":["Ο πραγματισμός, ιδιαίτερα όπως αναπτύχθηκε μέσα από τη σκέψη του Charles Sanders Peirce, του William James και αργότερα του John Dewey, ξεκινά από μια αρκετά διαφορετική αντίληψη για τη φιλοσοφία.","Δεν ρωτά μόνο:","«Είναι αυτή η ιδέα αληθινή;»"]},{"k":"text","l":"Ο πραγματισμός και η αλήθεια που δοκιμάζεται στη ζωή","th":0,"ls":["Ρωτά επίσης:","**«Τι διαφορά κάνει στη ζωή μας αν αυτή η ιδέα είναι αληθινή;»**"]},{"k":"text","l":"Ο πραγματισμός και η αλήθεια που δοκιμάζεται στη ζωή","th":0,"ls":["Αυτό δεν σημαίνει ότι ο πραγματιστής θεωρεί αληθινό οτιδήποτε είναι χρήσιμο. Μια ψευδαίσθηση μπορεί να είναι προσωρινά χρήσιμη. Μια προκατάληψη μπορεί να μας προσφέρει προσωρινή ασφάλεια. Ένα ψέμα μπορεί να διευκολύνει μια κατάσταση."]},{"k":"text","l":"Ο πραγματισμός και η αλήθεια που δοκιμάζεται στη ζωή","th":0,"ls":["Η πραγματιστική σκέψη είναι βαθύτερη.","Μια ιδέα πρέπει να δοκιμάζεται μέσα στην εμπειρία, στην πράξη, στην έρευνα, στον διάλογο και στις συνέπειές της.","Η γνώση δεν είναι ένα ακίνητο άγαλμα.","Είναι διαδικασία."]},{"k":"text","l":"Ο πραγματισμός και η αλήθεια που δοκιμάζεται στη ζωή","th":0,"ls":["Αυτό έχει τεράστια σημασία για τη σύγχρονη εποχή. Ζούμε σε μια κοινωνία που συχνά θέλει άμεσες απαντήσεις."]},{"k":"text","l":"Ο πραγματισμός και η αλήθεια που δοκιμάζεται στη ζωή","th":0,"ls":["Θέλουμε να ξέρουμε ποιος έχει δίκιο, ποιος έχει άδικο, ποια θεωρία είναι η τελική, ποια τεχνολογία θα λύσει το πρόβλημα, ποιο πολιτικό ή κοινωνικό μοντέλο είναι το καλύτερο.","Ο πραγματισμός μας λέει κάτι πιο ταπεινό:","**Δοκίμασε. Παρατήρησε. Μάθε. Διόρθωσε. Συνέχισε.**"]},{"k":"text","l":"Ο πραγματισμός και η αλήθεια που δοκιμάζεται στη ζωή","th":0,"ls":["Αυτό δεν είναι αδυναμία της σκέψης.","Είναι ωριμότητα.","Ο άνθρωπος που γνωρίζει ότι μπορεί να κάνει λάθος έχει μεγαλύτερη πιθανότητα να διορθώσει το λάθος του από εκείνον που είναι βέβαιος ότι δεν κάνει ποτέ λάθος."]},{"k":"text","l":"Ο πραγματισμός και η αλήθεια που δοκιμάζεται στη ζωή","th":0,"ls":["Και εδώ ο πραγματισμός συναντά την επιστήμη.","Η επιστήμη δεν προχωρά επειδή οι επιστήμονες γνωρίζουν τα πάντα. Προχωρά επειδή έχουν θεσμούς και μεθόδους που επιτρέπουν στις ιδέες να ελέγχονται, να αμφισβητούνται και να διορθώνονται."]},{"k":"text","l":"Ο πραγματισμός και η αλήθεια που δοκιμάζεται στη ζωή","th":0,"ls":["Η πραγματικότητα έχει τον τελευταίο λόγο."]},{"k":"sec","n":"2","t":"Η ηθική αρχίζει όταν η δύναμη μεγαλώνει","th":0},{"k":"text","l":"Η ηθική αρχίζει όταν η δύναμη μεγαλώνει","th":0,"ls":["Εδώ εμφανίζεται η ηθική.","Για μεγάλο μέρος της ανθρώπινης ιστορίας, η ηθική αφορούσε κυρίως τις σχέσεις ανάμεσα σε ανθρώπους: τι οφείλω στον γείτονά μου, στον φίλο μου, στην οικογένειά μου, στην πόλη μου, στον ξένο."]},{"k":"text","l":"Η ηθική αρχίζει όταν η δύναμη μεγαλώνει","th":0,"ls":["Σήμερα όμως η ανθρώπινη δύναμη έχει αυξηθεί τόσο πολύ, ώστε η ηθική πρέπει να διευρυνθεί.","Ένας άνθρωπος μπορεί να επηρεάσει όχι μόνο έναν άλλο άνθρωπο, αλλά χιλιάδες, εκατομμύρια ή ακόμη και ολόκληρα οικοσυστήματα."]},{"k":"text","l":"Η ηθική αρχίζει όταν η δύναμη μεγαλώνει","th":0,"ls":["Μπορούμε να αλλάξουμε το κλίμα.","Μπορούμε να τροποποιήσουμε γονίδια.","Μπορούμε να δημιουργήσουμε τεχνητά συστήματα που λαμβάνουν αποφάσεις.","Μπορούμε να παράγουμε τεράστιες ποσότητες πληροφορίας."]},{"k":"text","l":"Η ηθική αρχίζει όταν η δύναμη μεγαλώνει","th":0,"ls":["Μπορούμε να καταστρέψουμε δάση σε πολύ μεγαλύτερη κλίμακα από οποιαδήποτε προηγούμενη κοινωνία.","Μπορούμε επίσης να τα προστατεύσουμε με τεχνολογίες που οι προηγούμενες γενιές δεν διέθεταν."]},{"k":"text","l":"Η ηθική αρχίζει όταν η δύναμη μεγαλώνει","th":0,"ls":["Η τεχνολογία, επομένως, δεν είναι από μόνη της ούτε καλή ούτε κακή.","Είναι **πολλαπλασιαστής ανθρώπινης δυνατότητας**.","Και ακριβώς γι' αυτό δημιουργεί ηθική ευθύνη."]},{"k":"text","l":"Η ηθική αρχίζει όταν η δύναμη μεγαλώνει","th":0,"ls":["Ένα μαχαίρι μπορεί να κόψει ψωμί ή να τραυματίσει έναν άνθρωπο. Ένας υπολογιστής μπορεί να χρησιμοποιηθεί για εκπαίδευση ή για χειραγώγηση."]},{"k":"text","l":"Η ηθική αρχίζει όταν η δύναμη μεγαλώνει","th":0,"ls":["Η τεχνητή νοημοσύνη μπορεί να βοηθήσει έναν γιατρό να εντοπίσει μια ασθένεια ή να χρησιμοποιηθεί για μαζική παραπληροφόρηση.","Το ερώτημα λοιπόν δεν είναι:","«Είναι η τεχνολογία καλή ή κακή;»","Το ουσιαστικότερο ερώτημα είναι:","**«Ποιον κόσμο δημιουργούμε με τη χρήση της;»**"]},{"k":"sec","n":"3","t":"Η γλώσσα δεν περιγράφει απλώς τον κόσμο","th":0},{"k":"text","l":"Η γλώσσα δεν περιγράφει απλώς τον κόσμο","th":0,"ls":["Κάπου εδώ συναντούμε τη γλωσσολογία.","Ο άνθρωπος δεν ζει μόνο μέσα σε έναν φυσικό κόσμο.","Ζει και μέσα σε έναν κόσμο συμβόλων.","Ονομάζουμε τα δέντρα «δέντρα», τη θάλασσα «θάλασσα», ένα βουνό «βουνό», έναν άνθρωπο «άνθρωπο»."]},{"k":"text","l":"Η γλώσσα δεν περιγράφει απλώς τον κόσμο","th":0,"ls":["Αυτό φαίνεται αυτονόητο.","Αλλά δεν είναι.","Η γλώσσα χωρίζει την αδιάκοπη πραγματικότητα σε έννοιες."]},{"k":"text","l":"Η γλώσσα δεν περιγράφει απλώς τον κόσμο","th":0,"ls":["Το δάσος αποτελείται από αμέτρητα διαφορετικά πράγματα: δέντρα, έντομα, μύκητες, μικροοργανισμούς, νερό, χώμα, αέρα, ήχους, φως, θερμοκρασία. Εμείς τα συγκεντρώνουμε κάτω από μία λέξη:","**δάσος.**","Η λέξη είναι χρήσιμη."]},{"k":"text","l":"Η γλώσσα δεν περιγράφει απλώς τον κόσμο","th":0,"ls":["Αλλά δεν είναι το ίδιο το δάσος.","Αυτό είναι ένα από τα σημαντικότερα μαθήματα της φιλοσοφίας της γλώσσας.","Ο χάρτης δεν είναι η περιοχή.","Η λέξη «θάλασσα» δεν είναι η θάλασσα.","Η λέξη «θεός» δεν είναι ο Θεός.","Η λέξη «φύση» δεν είναι η φύση."]},{"k":"text","l":"Η γλώσσα δεν περιγράφει απλώς τον κόσμο","th":0,"ls":["Η λέξη «άνθρωπος» δεν περιέχει όλο το μυστήριο ενός ανθρώπου.","Η γλώσσα μάς επιτρέπει να επικοινωνούμε, αλλά ταυτόχρονα δημιουργεί όρια.","Μπορεί να γίνει γέφυρα.","Μπορεί να γίνει και φυλακή."]},{"k":"text","l":"Η γλώσσα δεν περιγράφει απλώς τον κόσμο","th":0,"ls":["Αν μια κοινωνία δεν έχει λέξεις για κάτι, δυσκολεύεται να το συζητήσει. Αν έχει υπερβολικά φτωχή γλώσσα, η σκέψη της μπορεί να γίνει φτωχή."]},{"k":"text","l":"Η γλώσσα δεν περιγράφει απλώς τον κόσμο","th":0,"ls":["Αν όμως θεωρήσει ότι οι λέξεις της αντιστοιχούν απόλυτα στην πραγματικότητα, μπορεί να ξεχάσει ότι η πραγματικότητα είναι πάντοτε μεγαλύτερη από τις περιγραφές της."]},{"k":"text","l":"Η γλώσσα δεν περιγράφει απλώς τον κόσμο","th":0,"ls":["Ίσως λοιπόν ένα μέρος της φιλοσοφικής ωριμότητας να είναι να γνωρίζουμε πότε πρέπει να χρησιμοποιούμε μια λέξη και πότε πρέπει να σωπαίνουμε μπροστά σε αυτό που η λέξη δεν μπορεί να περιγράψει."]},{"k":"sec","n":"4","t":"Η φύση δεν είναι σκηνικό","th":0},{"k":"text","l":"Η φύση δεν είναι σκηνικό","th":0,"ls":["Για αιώνες ο άνθρωπος αντιμετώπισε τη φύση σαν κάτι που βρίσκεται «εκεί έξω».","Το δάσος ήταν ένας πόρος.","Το ποτάμι ήταν ενέργεια.","Το βουνό ήταν ορυκτά.","Η θάλασσα ήταν τροφή και μεταφορά.","Σήμερα αρχίζουμε να καταλαβαίνουμε κάτι πιο παράξενο:","**Δεν υπάρχουμε απέναντι στη φύση. Υπάρχουμε μέσα στη φύση.**"]},{"k":"text","l":"Η φύση δεν είναι σκηνικό","th":0,"ls":["Ο άνθρωπος δεν είναι εξωτερικός παρατηρητής του οικοσυστήματος.","Είναι μέρος του."]},{"k":"text","l":"Η φύση δεν είναι σκηνικό","th":0,"ls":["Το οξυγόνο που αναπνέουμε, το νερό που πίνουμε, η τροφή που τρώμε, τα υλικά από τα οποία κατασκευάζουμε τα αντικείμενά μας, όλα συνδέονται με φυσικές διαδικασίες πολύ μεγαλύτερες από εμάς."]},{"k":"text","l":"Η φύση δεν είναι σκηνικό","th":0,"ls":["Η σύγχρονη πόλη μπορεί να δημιουργεί την ψευδαίσθηση ότι έχουμε ξεφύγει από τη φύση.","Δεν έχουμε.","Απλώς έχουμε δημιουργήσει ένα ιδιαίτερα περίπλοκο τεχνητό περιβάλλον μέσα στη φύση."]},{"k":"text","l":"Η φύση δεν είναι σκηνικό","th":0,"ls":["Και ίσως αυτό να είναι ένα από τα μεγάλα παράδοξα του πολιτισμού:","**όσο περισσότερο απομακρυνόμαστε από την άμεση εμπειρία της φύσης, τόσο περισσότερο εξαρτόμαστε από αυτήν.**","Ένα κινητό τηλέφωνο μπορεί να μας συνδέσει με ολόκληρο τον πλανήτη."]},{"k":"text","l":"Η φύση δεν είναι σκηνικό","th":0,"ls":["Αλλά δεν μπορεί να μας δώσει νερό.","Ένας υπερυπολογιστής μπορεί να υπολογίσει δισεκατομμύρια πράξεις.","Αλλά δεν μπορεί να δημιουργήσει ένα πραγματικό δάσος σε μια στιγμή.","Η τεχνολογία μπορεί να μιμηθεί πολλά πράγματα."]},{"k":"text","l":"Η φύση δεν είναι σκηνικό","th":0,"ls":["Δεν μπορεί να καταργήσει την πραγματικότητα από την οποία προήλθε."]},{"k":"sec","n":"5","t":"Είμαστε μόνοι στο Σύμπαν;","th":0},{"k":"text","l":"Είμαστε μόνοι στο Σύμπαν;","th":0,"ls":["Και τότε φτάνουμε στο μεγαλύτερο ερώτημα.","Είναι πιθανό να είμαστε μόνοι;","Ναι.","Είναι πιθανό να μην είμαστε;","Επίσης ναι.","Και αυτή ακριβώς είναι η γοητεία του προβλήματος."]},{"k":"text","l":"Είμαστε μόνοι στο Σύμπαν;","th":0,"ls":["Το Σύμπαν είναι τεράστιο. Υπάρχουν αμέτρητα άστρα και πλανητικά συστήματα. Έχουμε πλέον καταλάβει ότι οι πλανήτες δεν είναι σπάνιες εξαιρέσεις.","Αλλά το μέγεθος του Σύμπαντος από μόνο του δεν αποδεικνύει ότι υπάρχει ζωή αλλού."]},{"k":"text","l":"Είμαστε μόνοι στο Σύμπαν;","th":0,"ls":["Εδώ χρειάζεται ξανά πραγματισμός.","Δεν πρέπει να πούμε:","«Το Σύμπαν είναι τεράστιο, άρα σίγουρα υπάρχουν εξωγήινοι.»","Αλλά ούτε:","«Δεν έχουμε βρει εξωγήινη ζωή, άρα είμαστε μόνοι.»","Και οι δύο προτάσεις πηγαίνουν πέρα από τα διαθέσιμα στοιχεία."]},{"k":"text","l":"Είμαστε μόνοι στο Σύμπαν;","th":0,"ls":["Η επιστημονικά σοβαρή θέση είναι:","**Δεν γνωρίζουμε ακόμη.**","Και αυτή η φράση έχει τεράστια φιλοσοφική αξία.","Το «δεν γνωρίζω» δεν είναι κενό.","Είναι χώρος για έρευνα.","Ίσως υπάρχει μικροβιακή ζωή σε κάποιον μακρινό κόσμο.","Ίσως υπάρχουν πολιτισμοί."]},{"k":"text","l":"Είμαστε μόνοι στο Σύμπαν;","th":0,"ls":["Ίσως υπήρξαν πολιτισμοί που εξαφανίστηκαν πριν εμφανιστούμε εμείς.","Ίσως υπάρχουν μορφές ζωής που δεν θα αναγνωρίζαμε καν ως ζωή.","Και εδώ η γλωσσολογία συναντά την κοσμολογία.","Τι σημαίνει «ζωή»;","Πρέπει να έχει DNA;","Πρέπει να έχει κύτταρα;"]},{"k":"text","l":"Είμαστε μόνοι στο Σύμπαν;","th":0,"ls":["Πρέπει να βασίζεται στον άνθρακα;","Πρέπει να χρησιμοποιεί νερό;","Πρέπει να έχει μεταβολισμό;","Ίσως οι δικές μας λέξεις για τη ζωή να είναι τόσο ανθρωποκεντρικές όσο ήταν κάποτε οι παλιές αντιλήψεις μας για το Σύμπαν."]},{"k":"text","l":"Είμαστε μόνοι στο Σύμπαν;","th":0,"ls":["Ίσως ψάχνουμε «ζωή» με τον τρόπο που ένας άνθρωπος ψάχνει ένα γνώριμο αντικείμενο.","Και μπορεί το Σύμπαν να έχει κάτι πολύ διαφορετικό να μας δείξει."]},{"k":"sec","n":"6","t":"Το παράδοξο του πολιτισμού","th":0},{"k":"text","l":"Το παράδοξο του πολιτισμού","th":0,"ls":["Αν κάποτε συναντήσουμε έναν εξωγήινο πολιτισμό, ίσως το πιο ενδιαφέρον ερώτημα δεν θα είναι αν είναι πιο έξυπνος από εμάς.","Θα είναι:","**Τι έκανε με την ευφυΐα του;**","Αυτό είναι ίσως το πραγματικό μέτρο ενός πολιτισμού.","Όχι πόσο γρήγορα ταξιδεύει."]},{"k":"text","l":"Το παράδοξο του πολιτισμού","th":0,"ls":["Όχι πόσο μεγάλη είναι η οικονομία του.","Όχι πόσα όπλα διαθέτει.","Αλλά αν μπορεί να χρησιμοποιεί τη δύναμή του χωρίς να καταστρέφει τον ίδιο του τον κόσμο."]},{"k":"text","l":"Το παράδοξο του πολιτισμού","th":0,"ls":["Ένας πολιτισμός που μπορεί να κατασκευάσει τεράστια διαστημόπλοια αλλά δεν μπορεί να συνυπάρξει με τον ίδιο του τον πλανήτη έχει τεχνολογική δύναμη αλλά ίσως μικρή σοφία.","Εδώ η ηθική αποκτά κοσμική διάσταση."]},{"k":"text","l":"Το παράδοξο του πολιτισμού","th":0,"ls":["Ίσως η μεγαλύτερη τεχνολογική πρόοδος να μην είναι να κατακτήσουμε το Σύμπαν.","Ίσως να είναι να μάθουμε να κατοικούμε υπεύθυνα έναν μικρό πλανήτη."]},{"k":"sec","n":"7","t":"Η τεχνητή νοημοσύνη και το νέο φιλοσοφικό πρόβλημα","th":0},{"k":"text","l":"Η τεχνητή νοημοσύνη και το νέο φιλοσοφικό πρόβλημα","th":0,"ls":["Η τεχνητή νοημοσύνη φέρνει τώρα ένα νέο είδος ερωτήματος.","Όταν μια μηχανή παράγει γλώσσα, λύνει προβλήματα, αναλύει εικόνες, γράφει μουσική ή συμμετέχει σε διάλογο, τι ακριβώς σημαίνει «νοημοσύνη»;"]},{"k":"text","l":"Η τεχνητή νοημοσύνη και το νέο φιλοσοφικό πρόβλημα","th":0,"ls":["Είναι η νοημοσύνη η ικανότητα επίλυσης προβλημάτων;","Η κατανόηση;","Η συνείδηση;","Η εμπειρία;","Η προσαρμογή;","Η δημιουργικότητα;","Ή κάτι βαθύτερο;","Δεν έχουμε ακόμη οριστική απάντηση.","Και εδώ χρειάζεται προσοχή."]},{"k":"text","l":"Η τεχνητή νοημοσύνη και το νέο φιλοσοφικό πρόβλημα","th":0,"ls":["Δεν πρέπει να αποδίδουμε συνείδηση σε μια μηχανή μόνο επειδή χρησιμοποιεί ανθρώπινη γλώσσα.","Αλλά ούτε είναι φιλοσοφικά σοφό να θεωρούμε ότι γνωρίζουμε εκ των προτέρων τι είναι απαραίτητο για τη νοημοσύνη."]},{"k":"text","l":"Η τεχνητή νοημοσύνη και το νέο φιλοσοφικό πρόβλημα","th":0,"ls":["Το πρόβλημα είναι ότι εξετάζουμε την τεχνητή νοημοσύνη με ανθρώπινα μέτρα.","Ίσως χρειαστούμε νέες έννοιες.","Ίσως χρειαστούμε μια νέα φιλοσοφία της νοημοσύνης."]},{"k":"text","l":"Η τεχνητή νοημοσύνη και το νέο φιλοσοφικό πρόβλημα","th":0,"ls":["Και ίσως, τελικά, η μελέτη της τεχνητής νοημοσύνης μας αναγκάσει να μελετήσουμε ξανά τον ίδιο τον άνθρωπο."]},{"k":"sec","n":"8","t":"Μπορεί η φύση να έχει μορφές νοημοσύνης που δεν αναγνωρίζουμε;","th":0},{"k":"text","l":"Μπορεί η φύση να έχει μορφές νοημοσύνης που δεν αναγνωρίζουμε;","th":0,"ls":["Εδώ ανοίγει μια ακόμη πιο ενδιαφέρουσα πόρτα.","Τα δέντρα επικοινωνούν μέσω χημικών σημάτων.","Οι μύκητες σχηματίζουν τεράστια δίκτυα στο έδαφος.","Τα ζώα επικοινωνούν με ήχους, μυρωδιές, κινήσεις και ηλεκτρικά σήματα."]},{"k":"text","l":"Μπορεί η φύση να έχει μορφές νοημοσύνης που δεν αναγνωρίζουμε;","th":0,"ls":["Τα οικοσυστήματα παρουσιάζουν πολύπλοκες μορφές αλληλεπίδρασης.","Αυτό δεν σημαίνει ότι ένα δάσος σκέφτεται όπως ένας άνθρωπος.","Αλλά μας υποχρεώνει να εξετάσουμε κάτι:","**Μήπως η νοημοσύνη έχει περισσότερες μορφές από όσες μπορούμε να αναγνωρίσουμε;**"]},{"k":"text","l":"Μπορεί η φύση να έχει μορφές νοημοσύνης που δεν αναγνωρίζουμε;","th":0,"ls":["Ίσως η ανθρώπινη σκέψη είναι μία συγκεκριμένη μορφή οργάνωσης της πληροφορίας.","Ίσως υπάρχουν άλλες.","Δεν χρειάζεται να καταφύγουμε σε μυστικισμό για να αναγνωρίσουμε ότι η φύση είναι πολύ πιο περίπλοκη από την καθημερινή μας εμπειρία."]},{"k":"text","l":"Μπορεί η φύση να έχει μορφές νοημοσύνης που δεν αναγνωρίζουμε;","th":0,"ls":["Μπορούμε να είμαστε ταυτόχρονα επιστημονικά αυστηροί και φιλοσοφικά ανοιχτοί.","Αυτό είναι ίσως ένα από τα πιο δύσκολα πράγματα για τον άνθρωπο:","**να έχει ανοιχτό μυαλό χωρίς να εγκαταλείπει τα αποδεικτικά κριτήρια.**"]},{"k":"sec","n":"9","t":"Πραγματισμός χωρίς κυνισμό","th":0},{"k":"text","l":"Πραγματισμός χωρίς κυνισμό","th":0,"ls":["Υπάρχει όμως ένας κίνδυνος.","Αν πούμε ότι όλα πρέπει να κρίνονται από τις συνέπειές τους, μπορεί κάποιος να οδηγηθεί στον κυνισμό:","«Αν κάτι με συμφέρει, είναι καλό.»","Αυτό όμως δεν είναι πραγματισμός.","Είναι απλώς συμφεροντολογία."]},{"k":"text","l":"Πραγματισμός χωρίς κυνισμό","th":0,"ls":["Ο πραγματισμός μπορεί να είναι πολύ πιο απαιτητικός.","Πρέπει να ρωτήσουμε:","Ποιον ωφελεί;","Για πόσο;","Ποιον βλάπτει;","Τι συνέπειες θα έχει σε δέκα χρόνια;","Τι συνέπειες θα έχει για ανθρώπους που δεν έχουν φωνή;","Τι συνέπειες θα έχει για το περιβάλλον;"]},{"k":"text","l":"Πραγματισμός χωρίς κυνισμό","th":0,"ls":["Τι συνέπειες θα έχει για τις επόμενες γενιές;","Μια πράξη μπορεί να είναι χρήσιμη σήμερα και καταστροφική αύριο.","Άρα ο πραγματισμός χρειάζεται φαντασία.","Πρέπει να μπορεί να φανταστεί τις μελλοντικές συνέπειες των σημερινών πράξεων."]},{"k":"text","l":"Πραγματισμός χωρίς κυνισμό","th":0,"ls":["Και εδώ συναντά την ηθική."]},{"k":"sec","n":"10","t":"Η πραγματική πρόοδος","th":0},{"k":"text","l":"Η πραγματική πρόοδος","th":0,"ls":["Τι είναι λοιπόν πρόοδος;","Περισσότερη παραγωγή;","Περισσότερη τεχνολογία;","Περισσότερα δεδομένα;","Μεγαλύτερες πόλεις;","Περισσότερη κατανάλωση;","Ίσως όλα αυτά να είναι μορφές προόδου.","Αλλά δεν αρκούν."]},{"k":"text","l":"Η πραγματική πρόοδος","th":0,"ls":["Μια κοινωνία μπορεί να γίνεται τεχνολογικά προηγμένη και ταυτόχρονα ανθρώπινα φτωχότερη.","Μπορεί να έχει γρήγορο διαδίκτυο και αδύναμες κοινωνικές σχέσεις.","Μπορεί να διαθέτει τεράστια επιστημονική γνώση και ελάχιστη σοφία."]},{"k":"text","l":"Η πραγματική πρόοδος","th":0,"ls":["Μπορεί να παράγει περισσότερα αγαθά και να καταστρέφει το περιβάλλον από το οποίο εξαρτάται.","Η πρόοδος επομένως πρέπει να μετριέται σε περισσότερες από μία διαστάσεις.","**Τεχνολογική πρόοδος χωρίς ηθική πρόοδο είναι δύναμη χωρίς κατεύθυνση.**"]},{"k":"text","l":"Η πραγματική πρόοδος","th":0,"ls":["**Οικονομική ανάπτυξη χωρίς οικολογική σκέψη είναι πλούτος που τρώει το θεμέλιό του.**","**Γνώση χωρίς αυτοκριτική μπορεί να γίνει αλαζονεία.**","**Γλώσσα χωρίς διάλογο μπορεί να γίνει προπαγάνδα.**","**Ελευθερία χωρίς ευθύνη μπορεί να γίνει καταστροφή.**"]},{"k":"sec","n":"11","t":"Ίσως το μεγαλύτερο επίτευγμα να είναι η συνύπαρξη","th":0},{"k":"text","l":"Ίσως το μεγαλύτερο επίτευγμα να είναι η συνύπαρξη","th":0,"ls":["Υπάρχει ένα κοινό σημείο ανάμεσα στη φύση, στην ηθική, στη γλώσσα, στην επιστήμη και στην τεχνολογία.","Όλα μας οδηγούν στην έννοια της **σχέσης**.","Κανένα πράγμα δεν υπάρχει εντελώς μόνο του.","Ο άνθρωπος υπάρχει μέσα σε κοινωνίες."]},{"k":"text","l":"Ίσως το μεγαλύτερο επίτευγμα να είναι η συνύπαρξη","th":0,"ls":["Η γλώσσα υπάρχει ανάμεσα σε ανθρώπους.","Η ζωή υπάρχει μέσα σε οικοσυστήματα.","Η επιστήμη υπάρχει μέσα σε κοινότητες έρευνας.","Η τεχνολογία υπάρχει μέσα σε κοινωνικές δομές.","Ακόμη και ένας πλανήτης υπάρχει μέσα σε ένα κοσμικό περιβάλλον."]},{"k":"text","l":"Ίσως το μεγαλύτερο επίτευγμα να είναι η συνύπαρξη","th":0,"ls":["Ίσως λοιπόν η μεγάλη ψευδαίσθηση του ανθρώπου να είναι η απόλυτη ανεξαρτησία.","Νομίζουμε ότι μπορούμε να υπάρχουμε μόνοι.","Στην πραγματικότητα υπάρχουμε χάρη σε αμέτρητες σχέσεις που συνήθως δεν βλέπουμε.","Το δέντρο χρειάζεται το έδαφος."]},{"k":"text","l":"Ίσως το μεγαλύτερο επίτευγμα να είναι η συνύπαρξη","th":0,"ls":["Το έδαφος χρειάζεται μικροοργανισμούς.","Ο άνθρωπος χρειάζεται το δάσος.","Η πόλη χρειάζεται την ύπαιθρο.","Η επιστήμη χρειάζεται ελεύθερη σκέψη.","Η δημοκρατία χρειάζεται πολίτες.","Η τεχνολογία χρειάζεται ηθική.","Και ο πολιτισμός χρειάζεται μνήμη."]},{"k":"sec","n":"12","t":"Και αν είμαστε πράγματι μόνοι;","th":0},{"k":"text","l":"Και αν είμαστε πράγματι μόνοι;","th":0,"ls":["Ας επιστρέψουμε στο αρχικό ερώτημα.","Είμαστε μόνοι στο Σύμπαν;","Αν αύριο αποδεικνυόταν ότι δεν υπάρχει καμία άλλη ζωή πουθενά, η ανθρώπινη ζωή θα γινόταν λιγότερο σημαντική;","Ίσως το αντίθετο."]},{"k":"text","l":"Και αν είμαστε πράγματι μόνοι;","th":0,"ls":["Αν είμαστε οι μόνοι, τότε κάθε ανθρώπινη ζωή γίνεται ακόμη πιο πολύτιμη.","Κάθε γλώσσα που χάνεται.","Κάθε τραγούδι.","Κάθε ποίημα.","Κάθε φιλία.","Κάθε δάσος.","Κάθε παιδί που κοιτάζει τον ουρανό.","Κάθε άνθρωπος που προσπαθεί να καταλάβει τον κόσμο."]},{"k":"text","l":"Και αν είμαστε πράγματι μόνοι;","th":0,"ls":["Όλα αυτά θα αποτελούσαν μέρος της μοναδικής γνωστής προσπάθειας της ύλης να κοιτάξει τον εαυτό της και να αναρωτηθεί τι είναι.","Αλλά αν δεν είμαστε μόνοι, τότε το ερώτημα γίνεται ακόμη μεγαλύτερο.","Πόσοι πολιτισμοί υπάρχουν;"]},{"k":"text","l":"Και αν είμαστε πράγματι μόνοι;","th":0,"ls":["Πόσοι έχουν επιβιώσει;","Πόσοι απέτυχαν;","Πόσοι αντιμετώπισαν τα ίδια προβλήματα που αντιμετωπίζουμε εμείς;","Και άραγε κάποιος άλλος πολιτισμός έμαθε κάτι που εμείς δεν έχουμε ακόμη μάθει;"]},{"k":"text","l":"Και αν είμαστε πράγματι μόνοι;","th":0,"ls":["Ίσως η αναζήτηση εξωγήινης ζωής να μην είναι μόνο αναζήτηση «άλλων».","Ίσως να είναι ένας τρόπος να καταλάβουμε καλύτερα **τον εαυτό μας**."]},{"k":"sec","n":"13","t":"Η φιλοσοφία ως τρόπος ζωής","th":0},{"k":"text","l":"Η φιλοσοφία ως τρόπος ζωής","th":0,"ls":["Τελικά, η φιλοσοφία δεν χρειάζεται να είναι ένας πύργος γεμάτος δύσκολες λέξεις.","Μπορεί να αρχίζει από πολύ απλά ερωτήματα:","Τι γνωρίζω πραγματικά;","Γιατί πιστεύω αυτό που πιστεύω;","Τι συνέπειες έχουν οι πράξεις μου;","Πώς χρησιμοποιώ τη γλώσσα μου;"]},{"k":"text","l":"Η φιλοσοφία ως τρόπος ζωής","th":0,"ls":["Πώς συμπεριφέρομαι στους άλλους;","Τι χρωστάω στη φύση;","Τι είδους τεχνολογία θέλω να δημιουργήσω;","Τι κόσμο αφήνω πίσω μου;","Και, τελικά:","**Τι σημαίνει να ζεις καλά;**","Ο πραγματισμός μας λέει να κοιτάξουμε τις συνέπειες."]},{"k":"text","l":"Η φιλοσοφία ως τρόπος ζωής","th":0,"ls":["Η ηθική μας λέει να μην ξεχάσουμε την ευθύνη.","Η γλωσσολογία μας υπενθυμίζει ότι οι λέξεις μας δεν είναι ολόκληρη η πραγματικότητα.","Η επιστήμη μας διδάσκει να ελέγχουμε τις πεποιθήσεις μας.","Η φύση μάς θυμίζει ότι δεν είμαστε απομονωμένοι."]},{"k":"text","l":"Η φιλοσοφία ως τρόπος ζωής","th":0,"ls":["Η τεχνολογία μάς δίνει δύναμη.","Και το Σύμπαν μάς δίνει ταπεινότητα.","Ίσως αυτός ο συνδυασμός να είναι ένα είδος σύγχρονης σοφίας:","**να προχωρούμε χωρίς να πιστεύουμε ότι τα ξέρουμε όλα.**","Να δημιουργούμε χωρίς να καταστρέφουμε."]},{"k":"text","l":"Η φιλοσοφία ως τρόπος ζωής","th":0,"ls":["Να αμφισβητούμε χωρίς να μηδενίζουμε τα πάντα.","Να χρησιμοποιούμε την τεχνολογία χωρίς να γινόμαστε υπηρέτες της.","Να προστατεύουμε τη φύση χωρίς να αρνούμαστε τον πολιτισμό."]},{"k":"text","l":"Η φιλοσοφία ως τρόπος ζωής","th":0,"ls":["Να χρησιμοποιούμε τη γλώσσα για να επικοινωνούμε και όχι μόνο για να νικάμε.","Να αναζητούμε την αλήθεια χωρίς να απαιτούμε από την πραγματικότητα να ταιριάξει στις επιθυμίες μας."]},{"k":"text","l":"Η φιλοσοφία ως τρόπος ζωής","th":0,"ls":["Και να κοιτάζουμε τα άστρα γνωρίζοντας ότι ίσως κάποτε βρούμε εκεί κάτι.","Ή ίσως όχι.","Μέχρι τότε, όμως, υπάρχει κάτι που ήδη γνωρίζουμε:","**Έχουμε έναν ολόκληρο κόσμο μπροστά μας που ακόμη δεν έχουμε μάθει να κατοικούμε σωστά.**"]},{"k":"text","l":"Η φιλοσοφία ως τρόπος ζωής","th":0,"ls":["Και ίσως αυτή να είναι η πιο σημαντική φιλοσοφική πρόκληση του ανθρώπου.","Όχι να γίνει κύριος του Σύμπαντος.","Αλλά να γίνει αρκετά σοφός ώστε να μπορεί να συνυπάρξει με αυτό."]},{"k":"coll","t":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"1","t":"Η αλήθεια δεν φοβάται τη δοκιμή· φοβάται μόνο την ακινησία.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"2","t":"Μια ιδέα αξίζει όσο η πραγματικότητα που μπορεί να φωτίσει.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"3","t":"Δεν γνωρίζουμε πραγματικά κάτι μέχρι να δούμε τι αλλάζει όταν το εφαρμόσουμε.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"4","t":"Η αμφιβολία δεν είναι εχθρός της γνώσης· είνα ισμοί","th":1},{"k":"aph","n":"90","t":"Ο άνθρωπος ωριμάζει όταν μαθαίνει να ζει με αβεβαιότητα χωρίς να καταφεύγει σε ψευδείς βεβαιότητες.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"91","t":"Το καλύτερο μέλλον δεν είναι εκείνο που προβλέψαμε τέλεια, αλλά εκείνο που μπορούμε να διορθώσουμε όταν αλλάξουν τα δεδομένα.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"92","t":"Η ελπίδα χωρίς πράξη είναι επιθυμία· η πράξη χωρίς ελπίδα είναι μηχανισμός.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"93","t":"Να σκέφτεσαι μακριά, αλλά να ενεργείς εκεί όπου πραγματικά μπορείς να επηρεάσεις κάτι.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"94","t":"Το παρελθόν μάς δίνει στοιχεία, όχι εντολές.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"95","t":"Το μέλλον δεν χρειάζεται ανθρώπους που τα ξέρουν όλα· χρειάζεται ανθρώπους που μπορούν να μάθουν.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"96","t":"Ίσως η μεγαλύτερη μορφή προόδου να είναι να αποκτούμε δύναμη χωρίς να χάνουμε το μέτρο.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"97","t":"Ο άνθρωπος δεν γίνεται σοφότερος όταν κατακτά περισσότερα, αλλά όταν κατανοεί καλύτερα τις συνέπειες της κατάκτησής του.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"98","t":"Να αφήνεις χώρο στο άγνωστο· εκεί γεννιούνται πολλές από τις σημαντικότερες ιδέες.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"99","t":"Δεν χρειάζεται να γνωρίζουμε αν είμαστε μόνοι στο Σύμπαν για να αποφασίσουμε ότι δεν πρέπει να είμαστε μόνοι απέναντι στην ευθύνη.","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"aph","n":"100","t":"Η πιο πραγματιστική μορφή φιλοσοφίας είναι να ρωτάς: «Τι μπορώ να κάνω τώρα, ώστε ο κόσμος που θα ακολουθήσει να είναι λίγο καλύτερος από αυτόν που παρέλαβα;»","c":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","th":1},{"k":"coll","t":"100 σκληροί και φιλοσοφικά βαθιοί αφορισμοί","th":2},{"k":"aph","n":"1","t":"Η πραγματικότητα δεν ενδιαφέρεται αν είμαστε έτοιμοι να την αποδεχτούμε.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"2","t":"Ο άνθρωπος συχνά δεν αναζητά την αλήθεια· αναζητά μια αλήθεια που να μπορεί να αντέξει.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"3","t":"Η βεβαιότητα είναι μερικές φορές ο πιο κομψός τρόπος να κρυφτεί η άγνοια.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"4","t":"Μια πεποίθηση που δεν επιτρέπει στον εαυτό της να διαψευστεί δεν είναι γνώση· είναι άμυνα.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"5","t":"Η πραγματικότητα δεν γίνεται λιγότερο αληθινή επειδή μας καταστρέφει τις ψευδαισθήσεις.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"6","t":"Το δυσκολότερο πράγμα στη γνώση δεν είναι να μάθεις κάτι· είναι να ξεμάθεις κάτι που αγαπάς.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"7","t":"Ο άνθρωπος φοβάται περισσότερο μια αλήθεια που αλλάζει τη ζωή του παρά ένα ψέμα που την εξηγεί.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"8","t":"Η άγνοια γίνεται επικίνδυνη όταν αποκτά αυτοπεποίθηση.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"9","t":"Δεν είναι κάθε αμφιβολία σοφία· αλλά κάθε σοφία έχει περάσει κάποτε από την αμφιβολία.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"10","t":"Αν η θεωρία σου δεν μπορεί να επιβιώσει από την πραγματικότητα, δεν χρειάζεται να κατηγορήσεις την πραγματικότητα.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"11","t":"Η αλήθεια δεν είναι υποχρεωμένη να είναι παρήγορη, δίκαιη ή όμορφη.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"12","t":"Μερικές φορές η ωριμότητα αρχίζει όταν σταματάς να ζητάς από τον κόσμο να έχει νόημα για χάρη σου.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"13","t":"Ο άνθρωπος μπορεί να συγχωρήσει την πραγματικότητα για πολλά πράγματα, εκτός από το ότι δεν υπακούει στις επιθυμίες του.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"14","t":"Το γεγονός ότι μια ιδέα επιβίωσε για αιώνες αποδεικνύει την αντοχή της, όχι την αλήθεια της.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"15","t":"Η σκέψη γίνεται επικίνδυνη όταν παύει να μπορεί να στραφεί εναντίον του εαυτού της.","c":"Αλήθεια και πραγματικότητα","th":2},{"k":"aph","n":"16","t":"Η πράξη είναι ο σκληρός δικαστής των αφηρημένων ιδεών.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"17","t":"Μια φιλοσοφία που δεν αντέχει την καθημερινότητα είναι πιθανότατα καλύτερη για βιβλιοθήκη παρά για ζωή.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"18","t":"Το αποτέλεσμα δεν είναι όλη η αλήθεια μιας πράξης, αλλά είναι μέρος της αλήθειας που δεν μπορούμε να αγνοήσουμε.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"19","t":"Ο κόσμος δεν αλλάζει επειδή είχες δίκιο· αλλά επειδή έκανες κάτι με αυτό το δίκιο.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"20","t":"Η καλή πρόθεση είναι η αρχή της ηθικής, όχι η απόδειξή της.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"21","t":"Όποιος μιλά ασταμάτητα για αξίες αλλά δεν τις δοκιμάζει όταν κοστίζουν, έχει ιδέες — όχι αρχές.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"22","t":"Η θεωρία μπορεί να σε κάνει να φαίνεσαι έξυπνος· η πράξη αποκαλύπτει αν έμαθες πράγματι κάτι.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"23","t":"Ο πραγματισμός δεν ρωτά μόνο «τι είναι αλήθεια;» αλλά και «τι γίνεται όταν ζούμε σαν να είναι αλήθεια;».","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"24","t":"Η αποτυχία μιας ιδέας είναι συχνά πιο χρήσιμη από την επιτυχία μιας αυταπάτης.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"25","t":"Δεν υπάρχει πιο ακριβό λάθος από αυτό που αρνείται να μάθει από τον εαυτό του.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"26","t":"Η πραγματικότητα είναι το εργαστήριο όπου οι πεποιθήσεις πληρώνουν το κόστος των λαθών τους.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"27","t":"Μη θαυμάζεις μια θεωρία μέχρι να δεις πώς συμπεριφέρεται όταν τα πράγματα πάνε στραβά.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"28","t":"Η πρακτική σοφία είναι η τέχνη να ξέρεις πότε μια αρχή πρέπει να εφαρμοστεί και πότε πρέπει να επανεξεταστεί.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"29","t":"Ο δογματικός θέλει έναν κόσμο που να επιβεβαιώνει τη θεωρία του· ο πραγματιστής θέλει μια θεωρία που να αντέχει στον κόσμο.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"30","t":"Μερικές φορές το πιο φιλοσοφικό πράγμα που μπορείς να κάνεις είναι να αλλάξεις αυτό που κάνεις αύριο το πρωί.","c":"Πραγματισμός και πράξη","th":2},{"k":"aph","n":"31","t":"Ο άνθρωπος είναι ίσως το μόνο ζώο που μπορεί να υπερασπίζεται μια φυλακή επειδή την ονόμασε «ταυτότητα».","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"32","t":"Δεν γνωρίζουμε τον εαυτό μας τόσο καλά όσο νομίζουμε· γνωρίζουμε κυρίως την ιστορία που έχουμε μάθει να λέμε γι’ αυτόν.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"33","t":"Ο χαρακτήρας φαίνεται περισσότερο σε όσα θεωρούμε ότι δικαιούμαστε παρά σε όσα λέμε ότι πιστεύουμε.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"34","t":"Ο άνθρωπος μπορεί να ανεχθεί πολλά πράγματα, αρκεί να μπορεί να τα δικαιολογήσει στον εαυτό του.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"35","t":"Η αυτογνωσία δεν είναι να αγαπάς κάθε πλευρά του εαυτού σου· είναι να μπορείς να βλέπεις και εκείνες που θα προτιμούσες να μην υπάρχουν.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"36","t":"Μερικοί άνθρωποι δεν φοβούνται να χάσουν τον εαυτό τους· φοβούνται να ανακαλύψουν ότι δεν ήταν ποτέ αυτό που νόμιζαν.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"37","t":"Η ελευθερία αρχίζει όταν μπορείς να αμφισβητήσεις ακόμη και τις επιθυμίες που θεωρούσες δικές σου.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"38","t":"Δεν είμαστε μόνο όσα επιλέγουμε· είμαστε και όσα ανεχόμαστε να επαναλαμβάνονται.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"39","t":"Η συνήθεια είναι μια απόφαση που ξέχασε ότι κάποτε ήταν απόφαση.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"40","t":"Ο άνθρωπος συχνά προτιμά τη γνώριμη δυστυχία από την άγνωστη ελευθερία.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"41","t":"Η αξιοπρέπεια δεν είναι να μη λυγίζεις ποτέ· είναι να ξέρεις πότε δεν πρέπει να σπάσεις.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"42","t":"Όποιος δεν μπορεί να πει «έκανα λάθος» έχει παραδώσει την προσωπικότητά του στην ανάγκη να φαίνεται αλάνθαστος.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"43","t":"Η αυτοεξαπάτηση είναι η μόνη μορφή εξαπάτησης όπου ο απατεώνας πληρώνει και το θύμα.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"44","t":"Το εγώ δεν χρειάζεται πάντα να νικήσει· συχνά χρειάζεται απλώς να έχει τον τελευταίο λόγο.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"45","t":"Μερικές φορές η μεγαλύτερη προσωπική ελευθερία είναι να πάψεις να χρειάζεσαι μια συγκεκριμένη εικόνα του εαυτού σου.","c":"Άνθρωπος και εαυτός","th":2},{"k":"aph","n":"46","t":"Η ηθική αρχίζει εκεί όπου τελειώνει η ερώτηση «τι με συμφέρει;».","c":"Ηθική","th":2},{"k":"aph","n":"47","t":"Ο πραγματικός χαρακτήρας μιας κοινωνίας φαίνεται στον τρόπο που φέρεται σε εκείνους από τους οποίους δεν χρειάζεται τίποτα.","c":"Ηθική","th":2},{"k":"aph","n":"48","t":"Το να μην κάνεις κακό επειδή φοβάσαι την τιμωρία είναι υπακοή· το να μην το κάνεις ενώ μπορείς είναι ηθική.","c":"Ηθική","th":2},{"k":"aph","n":"49","t":"Η δικαιοσύνη που εφαρμόζεται μόνο όταν μας ευνοεί είναι απλώς εκλεπτυσμένος εγωισμός.","c":"Ηθική","th":2},{"k":"aph","n":"50","t":"Η καλοσύνη που χρειάζεται θεατές έχει ήδη χάσει κάτι από την καλοσύνη της.","c":"Ηθική","th":2},{"k":"aph","n":"51","t":"Το μεγαλύτερο ηθικό λάθος δεν είναι πάντοτε η σκληρότητα· είναι η αδιαφορία απέναντι στη συνέπεια.","c":"Ηθική","th":2},{"k":"aph","n":"52","t":"Όσο μεγαλώνει η δύναμή σου, τόσο μικρότερη γίνεται η δικαιολογία σου για να μην ξέρεις τι προκαλείς.","c":"Ηθική","th":2},{"k":"aph","n":"53","t":"Μια κοινωνία μπορεί να έχει νόμους χωρίς να έχει δικαιοσύνη.","c":"Ηθική","th":2},{"k":"aph","n":"54","t":"Η νομιμότητα είναι το ελάχιστο όριο της κοινωνικής ευθύνης, όχι το ύψιστο.","c":"Ηθική","th":2},{"k":"aph","n":"55","t":"Το ότι όλοι κάνουν κάτι δεν μετατρέπει την πράξη σε σωστή· μετατρέπει μόνο το λάθος σε συνήθεια.","c":"Ηθική","th":2},{"k":"aph","n":"56","t":"Η ηθική γίνεται δύσκολη όταν πρέπει να προστατεύσεις έναν άνθρωπο που δεν συμπαθείς.","c":"Ηθική","th":2},{"k":"aph","n":"57","t":"Η αληθινή δοκιμή της ανεκτικότητας είναι η συνύπαρξη με αυτόν που δεν μπορείς εύκολα να καταλάβεις.","c":"Ηθική","th":2},{"k":"aph","n":"58","t":"Το καλό που απαιτεί να εξευτελίσεις τον άλλον για να το επιτύχεις έχει ήδη χάσει μέρος του νοήματός του.","c":"Ηθική","th":2},{"k":"aph","n":"59","t":"Μερικές φορές η πιο ανήθικη πράξη είναι να γνωρίζεις και να επιλέγεις να μην κοιτάξεις.","c":"Ηθική","th":2},{"k":"aph","n":"60","t":"Η ηθική δεν χρειάζεται τέλειους ανθρώπους· χρειάζεται ανθρώπους που μπορούν να διορθώνονται.","c":"Ηθική","th":2},{"k":"aph","n":"61","t":"Η εξουσία δεν αποκαλύπτει μόνο τον χαρακτήρα αυτού που την αποκτά· αποκαλύπτει και εκείνον που τη δέχεται χωρίς ερώτηση.","c":"Εξουσία και κοινωνία","th":2},{"k":"aph","n":"62","t":"Όταν μια κοινωνία φοβάται υπερβολικά τη διαφωνία, σύντομα φοβάται και τη σκέψη.","c":"Εξουσία και κοινωνία","th":2},{"k":"aph","n":"63","t":"Η προπαγάνδα δεν χρειάζεται να πείσει τους πάντες· αρκεί να κάνει την αλήθεια να φαίνεται αβέβαιη.","c":"Εξουσία και κοινωνία","th":2},{"k":"aph","n":"64","t":"Ο άνθρωπος που ελέγχει τις λέξεις μιας κοινωνίας αποκτά μέρος του ελέγχου πάνω στη σκέψη της.","c":"Εξουσία και κοινωνία","th":2},{"k":"aph","n":"65","t":"Μια κοινωνία δεν γίνεται ελεύθερη απλώς επειδή επιτρέπεται να μιλά· γίνεται ελεύθερη όταν μπορεί και να ακούει.","c":"Εξουσία και κοινωνία","th":2},{"k":"aph","n":"66","t":"Η μάζα δεν είναι πάντοτε σοφότερη από το άτομο· μερικές φορές είναι απλώς περισσότερα άτομα που επαναλαμβάνουν το ίδιο λάθος.","c":"Εξουσία και κοινωνία","th":2},{"k":"aph","n":"67","t":"Η δημοκρατία πεθαίνει όχι μόνο όταν απαγορεύεται η διαφωνία, αλλά και όταν η διαφωνία γίνεται αδύνατο να ακουστεί.","c":"Εξουσία και κοινωνία","th":2},{"k":"aph","n":"68","t":"Όταν η ταυτότητα γίνεται πιο σημαντική από την αλήθεια, ο διάλογος μετατρέπεται σε πόλεμο.","c":"Εξουσία και κοινωνία","th":2},{"k":"aph","n":"69","t":"Ο φανατισμός είναι η στιγμή που η αμφιβολία θεωρείται προδοσία.","c":"Εξουσία και κοινωνία","th":2},{"k":"aph","n":"70","t":"Ο πολιτισμός δεν φαίνεται από το πόσο δυνατά μπορεί να επιβληθεί, αλλά από το πόσο ήρεμα μπορεί να συνυπάρξει με τη διαφωνία.","c":"Εξουσία και κοινωνία","th":2},{"k":"aph","n":"71","t":"Η φύση δεν χρειάζεται την άδειά μας για να συνεχίσει χωρίς εμάς.","c":"Φύση και άνθρωπος","th":2},{"k":"aph","n":"72","t":"Ο άνθρωπος είναι αρκετά ισχυρός για να αλλάξει τον πλανήτη και αρκετά αφελής για να ξεχάσει ότι βρίσκεται πάνω του.","c":"Φύση και άνθρωπος","th":2},{"k":"aph","n":"73","t":"Δεν καταστρέφουμε τη φύση επειδή είμαστε ισχυρότεροι από αυτήν· την καταστρέφουμε επειδή ξεχνάμε πόσο εξαρτώμαστε από αυτήν.","c":"Φύση και άνθρωπος","th":2},{"k":"aph","n":"74","t":"Το δάσος δεν είναι πλούτος επειδή μπορούμε να το πουλήσουμε· είναι πλούτος επειδή δεν μπορούμε εύκολα να το αντικαταστήσουμε.","c":"Φύση και άνθρωπος","th":2},{"k":"aph","n":"75","t":"Η φύση δεν είναι ηθική ούτε ανήθικη· η ηθική αρχίζει όταν ο άνθρωπος αποφασίζει τι θα κάνει απέναντί της.","c":"Φύση και άνθρωπος","th":2},{"k":"aph","n":"76","t":"Όποιος θεωρεί τον άνθρωπο απολύτως ξεχωριστό από τη φύση ξεχνά από τι αποτελείται.","c":"Φύση και άνθρωπος","th":2},{"k":"aph","n":"77","t":"Η τεχνολογία μπορεί να μας προστατεύσει από ορισμένες συνέπειες της φύσης· δεν μπορεί να μας απαλλάξει από το γεγονός ότι είμαστε μέρος της.","c":"Φύση και άνθρωπος","th":2},{"k":"aph","n":"78","t":"Η οικολογική καταστροφή είναι συχνά το αποτέλεσμα μιας πολύ ανθρώπινης λογικής: κέρδος τώρα, συνέπειες αργότερα.","c":"Φύση και άνθρωπος","th":2},{"k":"aph","n":"79","t":"Το μέλλον της φύσης δεν είναι μόνο οικολογικό ζήτημα· είναι ζήτημα μνήμης, πολιτισμού και δικαιοσύνης.","c":"Φύση και άνθρωπος","th":2},{"k":"aph","n":"80","t":"Ίσως ο άνθρωπος να χρειάζεται λιγότερο να κυριαρχήσει στη φύση και περισσότερο να μάθει να κατοικεί μέσα της.","c":"Φύση και άνθρωπος","th":2},{"k":"aph","n":"81","t":"Η τεχνολογία δεν μας κάνει σοφότερους· απλώς μας επιτρέπει να κάνουμε περισσότερα πράγματα με τη σοφία ή την ανοησία που ήδη έχουμε.","c":"Τεχνολογία και μέλλον","th":2},{"k":"aph","n":"82","t":"Όταν η ταχύτητα γίνεται αυτοσκοπός, κάποια στιγμή ξεχνάμε να ρωτήσουμε πού πηγαίνουμε.","c":"Τεχνολογία και μέλλον","th":2},{"k":"aph","n":"83","t":"Μια μηχανή μπορεί να υπολογίσει τα πάντα και να μη γνωρίζει τι αξίζει να υπολογιστεί.","c":"Τεχνολογία και μέλλον","th":2},{"k":"aph","n":"84","t":"Το πρόβλημα της τεχνητής νοημοσύνης ίσως δεν είναι πρώτα αν θα γίνει ανθρώπινη, αλλά αν ο άνθρωπος θα γίνει πιο μηχανικός.","c":"Τεχνολογία και μέλλον","th":2},{"k":"aph","n":"85","t":"Κάθε τεχνολογία που εξοικονομεί χρόνο δημιουργεί το ερώτημα: τι θα κάνουμε με τον χρόνο που κερδίσαμε;","c":"Τεχνολογία και μέλλον","th":2},{"k":"aph","n":"86","t":"Η πληροφορία αυξάνεται ταχύτερα από τη σοφία· γι’ αυτό ο σύγχρονος άνθρωπος μπορεί να γνωρίζει περισσότερα και να κατανοεί λιγότερα.","c":"Τεχνολογία και μέλλον","th":2},{"k":"aph","n":"87","t":"Το πιο επικίνδυνο εργαλείο δεν είναι αυτό που είναι πολύ ισχυρό, αλλά αυτό που χρησιμοποιείται χωρίς να κατανοούμε τις συνέπειές του.","c":"Τεχνολογία και μέλλον","th":2},{"k":"aph","n":"88","t":"Ο πολιτισμός που μπορεί να δημιουργήσει τεχνητή νοημοσύνη αλλά δεν μπορεί να ελέγξει την απληστία του έχει λύσει λάθος πρόβλημα.","c":"Τεχνολογία και μέλλον","th":2},{"k":"aph","n":"89","t":"Δεν θα κριθεί ο πολιτισμός μας από το πόσο έξυπνες μηχανές κατασκευάσαμε, αλλά από το τι επιλέξαμε να κάνουμε με αυτές.","c":"Τεχνολογία και μέλλον","th":2},{"k":"aph","n":"90","t":"Το μέλλον δεν είναι ένα μέρος στο οποίο πηγαίνουμε· είναι το αποτέλεσμα όσων θεωρούμε σήμερα αποδεκτά.","c":"Τεχνολογία και μέλλον","th":2},{"k":"aph","n":"91","t":"Αν είμαστε μόνοι στο Σύμπαν, η ευθύνη μας είναι μεγαλύτερη· αν δεν είμαστε, η ταπεινότητά μας πρέπει να είναι μεγαλύτερη.","c":"Το Σύμπαν, η μοναξιά και το νόημα","th":2},{"k":"aph","n":"92","t":"Το ότι δεν έχουμε βρει ζωή αλλού δεν αποδεικνύει ότι δεν υπάρχει· αποδεικνύει μόνο ότι μέχρι τώρα δεν την έχουμε βρει.","c":"Το Σύμπαν, η μοναξιά και το νόημα","th":2},{"k":"aph","n":"93","t":"Ίσως το πιο παράξενο πράγμα στο Σύμπαν να μην είναι ότι υπάρχει ζωή, αλλά ότι η ζωή έφτασε κάποτε να ρωτήσει τι είναι το Σύμπαν.","c":"Το Σύμπαν, η μοναξιά και το νόημα","th":2},{"k":"aph","n":"94","t":"Αν το Σύμπαν είναι αδιάφορο απέναντί μας, αυτό δεν μας απελευθερώνει από την ευθύνη· μας αφήνει να τη δημιουργήσουμε μόνοι μας.","c":"Το Σύμπαν, η μοναξιά και το νόημα","th":2},{"k":"aph","n":"95","t":"Το νόημα δεν χρειάζεται να είναι γραμμένο στα άστρα για να είναι πραγματικό στη ζωή.","c":"Το Σύμπαν, η μοναξιά και το νόημα","th":2},{"k":"aph","n":"96","t":"Ίσως δεν είμαστε το κέντρο του Σύμπαντος· μπορούμε όμως να αποφασίσουμε αν θα είμαστε κέντρο ευθύνης για τον μικρό μας κόσμο.","c":"Το Σύμπαν, η μοναξιά και το νόημα","th":2},{"k":"aph","n":"97","t":"Ο θάνατος δεν αποδεικνύει ότι η ζωή στερείται νοήματος· αποδεικνύει ότι ο χρόνος της είναι περιορισμένος.","c":"Το Σύμπαν, η μοναξιά και το νόημα","th":2},{"k":"aph","n":"98","t":"Το άγνωστο είναι μεγαλύτερο από τη γνώση μας· αυτή δεν είναι προσβολή για τον άνθρωπο αλλά πρόσκληση.","c":"Το Σύμπαν, η μοναξιά και το νόημα","th":2},{"k":"aph","n":"99","t":"Ίσως η ωριμότητα ενός πολιτισμού αρχίζει όταν κοιτάζει τα άστρα χωρίς να θεωρεί ότι του ανήκουν.","c":"Το Σύμπαν, η μοναξιά και το νόημα","th":2},{"k":"aph","n":"100","t":"Δεν ξέρουμε αν το Σύμπαν έχει νόημα· ξέρουμε όμως ότι οι πράξεις μας έχουν συνέπειες, και ίσως εκεί να αρχίζει το δικό μας νόημα.","c":"Το Σύμπαν, η μοναξιά και το νόημα","th":2},{"k":"coll","t":"100 σκοτεινοί φιλοσοφικοί αφορισμοί","th":3},{"k":"aph","n":"1","t":"Η αλήθεια δεν είναι πάντα φως· μερικές φορές είναι το σκοτάδι που αποκαλύπτει το φως ως εξαίρεση.","c":"Για την αλήθεια","th":3},{"k":"aph","n":"2","t":"Υπάρχουν αλήθειες που δεν μας ελευθερώνουν ούτε μας καταστρέφουν· απλώς μας κάνουν να βλέπουμε διαφορετικά.","c":"Για την αλήθεια","th":3},{"k":"aph","n":"3","t":"Το ψέμα δεν χρειάζεται να είναι πειστικό· αρκεί να είναι πιο εύκολο από την αλήθεια.","c":"Για την αλήθεια","th":3},{"k":"aph","n":"4","t":"Ο άνθρωπος δεν φοβάται τόσο το άγνωστο όσο φοβάται ότι το γνωστό του ήταν ψέμα.","c":"Για την αλήθεια","th":3},{"k":"aph","n":"5","t":"Μερικές βεβαιότητες είναι απλώς φόβοι που έμαθαν να μιλούν με σιγουριά.","c":"Για την αλήθεια","th":3},{"k":"aph","n":"6","t":"Η αλήθεια μπορεί να περιμένει χρόνια· η αυταπάτη χρειάζεται μόνο μια στιγμή.","c":"Για την αλήθεια","th":3},{"k":"aph","n":"7","t":"Όταν μια ιδέα γίνεται πολύ σημαντική για να αμφισβητηθεί, έχει ήδη γίνει πιο σημαντική από την αλήθεια.","c":"Για την αλήθεια","th":3},{"k":"aph","n":"8","t":"Δεν είναι κάθε σκοτάδι άγνοια· μερικά σκοτάδια είναι πράγματα που δεν έχουμε ακόμη μάθει να βλέπουμε.","c":"Για την αλήθεια","th":3},{"k":"aph","n":"9","t":"Η πραγματικότητα δεν κρύβεται πάντοτε· συχνά εμείς κοιτάζουμε μόνο εκεί όπου περιμένουμε να τη βρούμε.","c":"Για την αλήθεια","th":3},{"k":"aph","n":"10","t":"Μερικές φορές η αλήθεια δεν απαντά στο ερώτημα· αλλάζει το ερώτημα.","c":"Για την αλήθεια","th":3},{"k":"aph","n":"11","t":"Ο άνθρωπος είναι ένα ζώο που μπορεί να κατασκευάζει λόγους για όσα ήδη αποφάσισε να κάνει.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"12","t":"Πολλοί αναζητούν τον εαυτό τους αφού πρώτα έχουν περάσει χρόνια κατασκευάζοντάς τον για τους άλλους.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"13","t":"Η συνείδηση μπορεί να είναι καθρέφτης, αλλά κανείς δεν εγγυάται ότι ο καθρέφτης είναι καθαρός.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"14","t":"Μερικές από τις βαθύτερες φυλακές μας δεν έχουν τοίχους· έχουν εξηγήσεις.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"15","t":"Ο άνθρωπος συνηθίζει ακόμη και τα δεσμά του, αρκεί να μπορεί να τα ονομάσει επιλογές.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"16","t":"Δεν γνωρίζουμε πόσο ελεύθεροι είμαστε· γνωρίζουμε μόνο πόσο εύκολα μπορούμε να πιστέψουμε ότι είμαστε.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"17","t":"Η μνήμη δεν διατηρεί το παρελθόν· διατηρεί την εκδοχή του παρελθόντος που μπορούμε ακόμη να αντέξουμε.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"18","t":"Ο άνθρωπος θυμάται επιλεκτικά και μετά ονομάζει τη σύνθεση αυτή ταυτότητα.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"19","t":"Κάθε χαρακτήρας έχει πλευρές που εμφανίζονται μόνο όταν υπάρχει κάτι να χάσει.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"20","t":"Ίσως η αυτογνωσία να είναι λιγότερο η ανακάλυψη του εαυτού και περισσότερο η ανακάλυψη των δικαιολογιών του.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"21","t":"Δεν αλλάζουμε πάντοτε επειδή καταλάβαμε· μερικές φορές αλλάζουμε επειδή δεν μπορούμε πια να κρυφτούμε από τις συνέπειες.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"22","t":"Ο άνθρωπος μπορεί να συνηθίσει σχεδόν τα πάντα, και αυτή ίσως είναι μία από τις πιο επικίνδυνες ικανότητές του.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"23","t":"Η αξιοπρέπεια δεν είναι η απουσία αδυναμίας· είναι η σχέση μας με αυτήν.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"24","t":"Υπάρχουν άνθρωποι που δεν θέλουν να βρουν την αλήθεια για τον εαυτό τους επειδή φοβούνται ότι θα πρέπει να αλλάξουν.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"25","t":"Ο εαυτός είναι συχνά το τελευταίο πράγμα που εξετάζουμε όταν ψάχνουμε την αιτία των προβλημάτων μας.","c":"Για τον άνθρωπο","th":3},{"k":"aph","n":"26","t":"Η γλώσσα δεν φυλακίζει την πραγματικότητα· φυλακίζει συχνά την προσδοκία μας γι’ αυτήν.","c":"Για τη γλώσσα","th":3},{"k":"aph","n":"27","t":"Μια λέξη μπορεί να φωτίσει μια έννοια και ταυτόχρονα να κρύψει όλα όσα δεν χωρούν μέσα της.","c":"Για τη γλώσσα","th":3},{"k":"aph","n":"28","t":"Όταν δεν βρίσκουμε τη σωστή λέξη, δεν σημαίνει πάντα ότι δεν καταλαβαίνουμε· ίσως σημαίνει ότι αυτό που καταλαβαίνουμε είναι μεγαλύτερο από τη γλώσσα μας.","c":"Για τη γλώσσα","th":3},{"k":"aph","n":"29","t":"Οι άνθρωποι διαφωνούν συχνά όχι επειδή βλέπουν διαφορετικά τον κόσμο, αλλά επειδή χρησιμοποιούν τις ίδιες λέξεις για διαφορετικούς κόσμους.","c":"Για τη γλώσσα","th":3},{"k":"aph","n":"30","t":"Η γλώσσα μπορεί να μεταφέρει τη σκέψη και ταυτόχρονα να την παραμορφώνει.","c":"Για τη γλώσσα","th":3},{"k":"aph","n":"31","t":"Μερικές λέξεις έχουν τόση ιστορία μέσα τους ώστε κανείς δεν τις χρησιμοποιεί πραγματικά αθώα.","c":"Για τη γλώσσα","th":3},{"k":"aph","n":"32","t":"Όταν μια κοινωνία αλλάζει τις λέξεις της, δεν αλλάζει απαραίτητα την πραγματικότητα· αλλάζει όμως τον τρόπο με τον οποίο την αντιμετωπίζει.","c":"Για τη γλώσσα","th":3},{"k":"aph","n":"33","t":"Η σιωπή δεν σημαίνει πάντα έλλειψη σκέψης· μερικές φορές σημαίνει ότι η σκέψη δεν εμπιστεύεται ακόμη τη γλώσσα.","c":"Για τη γλώσσα","th":3},{"k":"aph","n":"34","t":"Ο άνθρωπος μπορεί να γίνει αιχμάλωτος μιας λέξης που κάποτε επινόησε για να περιγράψει τον εαυτό του.","c":"Για τη γλώσσα","th":3},{"k":"aph","n":"35","t":"Όσο περισσότερα ονόματα δίνουμε στον κόσμο, τόσο πιο εύκολο γίνεται να ξεχάσουμε ότι ο κόσμος δεν τα χρειάζεται.","c":"Για τη γλώσσα","th":3},{"k":"aph","n":"36","t":"Η φύση δεν είναι ούτε καλή ούτε κακή· η αδιαφορία της είναι πιο παλιά από την ηθική μας.","c":"Για τη φύση","th":3},{"k":"aph","n":"37","t":"Ένα δάσος μπορεί να υπάρχει χωρίς να γνωρίζει ότι το ονομάζουμε δάσος.","c":"Για τη φύση","th":3},{"k":"aph","n":"38","t":"Η φύση δεν μας μισεί όταν μας καταστρέφει· απλώς δεν μας χρωστά προστασία.","c":"Για τη φύση","th":3},{"k":"aph","n":"39","t":"Ο άνθρωπος φοβάται τη φύση όταν θυμάται ότι δεν είναι κύριός της.","c":"Για τη φύση","th":3},{"k":"aph","n":"40","t":"Το βουνό δεν γνωρίζει αν το θαυμάζουμε, αλλά εμείς αλλάζουμε όταν το κοιτάζουμε.","c":"Για τη φύση","th":3},{"k":"aph","n":"41","t":"Μπορούμε να καταστρέψουμε ένα οικοσύστημα σε χρόνια και να χρειαστούν αιώνες για να καταλάβουμε τι χάσαμε.","c":"Για τη φύση","th":3},{"k":"aph","n":"42","t":"Η φύση δεν έχει ανάγκη την ανθρώπινη ηθική για να είναι πολύπλοκη.","c":"Για τη φύση","th":3},{"k":"aph","n":"43","t":"Ίσως το πιο παράξενο πράγμα στη φύση να μην είναι η βία της, αλλά η αδιαφορία της απέναντι στη δική μας ανάγκη για νόημα.","c":"Για τη φύση","th":3},{"k":"aph","n":"44","t":"Το δέντρο δεν γνωρίζει ότι είναι αρχαίο· η ηλικία του υπάρχει χωρίς να χρειάζεται ανθρώπινη μνήμη.","c":"Για τη φύση","th":3},{"k":"aph","n":"45","t":"Όσο περισσότερο μετατρέπουμε τη φύση σε αντικείμενο, τόσο δυσκολότερο γίνεται να καταλάβουμε ότι είμαστε μέρος της.","c":"Για τη φύση","th":3},{"k":"aph","n":"46","t":"Ο χρόνος δεν παίρνει μόνο πράγματα από εμάς· παίρνει και την ψευδαίσθηση ότι θα τα έχουμε για πάντα.","c":"Για τον χρόνο","th":3},{"k":"aph","n":"47","t":"Το παρελθόν δεν επιστρέφει, αλλά συνεχίζει να αποφασίζει πράγματα για το παρόν.","c":"Για τον χρόνο","th":3},{"k":"aph","n":"48","t":"Κάθε στιγμή είναι μοναδική ακριβώς επειδή δεν μπορεί να επαναληφθεί.","c":"Για τον χρόνο","th":3},{"k":"aph","n":"49","t":"Η μνήμη είναι ένας τρόπος να κρατάμε κάτι που ο χρόνος έχει ήδη κερδίσει.","c":"Για τον χρόνο","th":3},{"k":"aph","n":"50","t":"Ο άνθρωπος σχεδιάζει το μέλλον χρησιμοποιώντας έναν εγκέφαλο που έχει κατασκευαστεί από το παρελθόν.","c":"Για τον χρόνο","th":3},{"k":"aph","n":"51","t":"Το μέλλον δεν είναι άγνωστο επειδή είναι μακριά· είναι άγνωστο επειδή δεν έχει ακόμη γίνει.","c":"Για τον χρόνο","th":3},{"k":"aph","n":"52","t":"Ο χρόνος δεν εξηγεί τίποτα· απλώς επιτρέπει στις συνέπειες να εμφανιστούν.","c":"Για τον χρόνο","th":3},{"k":"aph","n":"53","t":"Μερικές απώλειες δεν γίνονται μικρότερες με τον χρόνο· απλώς γίνονται μέρος του τρόπου με τον οποίο βλέπουμε τον κόσμο.","c":"Για τον χρόνο","th":3},{"k":"aph","n":"54","t":"Ό,τι θεωρούμε μόνιμο είναι συνήθως κάτι που δεν έχουμε ακόμη δει να τελειώνει.","c":"Για τον χρόνο","th":3},{"k":"aph","n":"55","t":"Η θνητότητα είναι το όριο που μετατρέπει τη διάρκεια σε επιλογή.","c":"Για τον χρόνο","th":3},{"k":"aph","n":"56","t":"Μπορούμε να είμαστε ανάμεσα σε χιλιάδες ανθρώπους και να μην υπάρχει κανείς που να γνωρίζει τι συμβαίνει μέσα μας.","c":"Για τη μοναξιά και τις σχέσεις","th":3},{"k":"aph","n":"57","t":"Η μοναξιά δεν είναι πάντοτε απουσία ανθρώπων· μερικές φορές είναι απουσία κατανόησης.","c":"Για τη μοναξιά και τις σχέσεις","th":3},{"k":"aph","n":"58","t":"Κάθε άνθρωπος που γνωρίζουμε είναι ένας κόσμος που δεν θα γνωρίσουμε ποτέ ολοκληρωτικά.","c":"Για τη μοναξιά και τις σχέσεις","th":3},{"k":"aph","n":"59","t":"Οι σχέσεις δεν καταργούν την απόσταση ανάμεσα σε δύο συνειδήσεις· απλώς την κάνουν κατοικήσιμη.","c":"Για τη μοναξιά και τις σχέσεις","th":3},{"k":"aph","n":"60","t":"Μερικοί άνθρωποι μας γνωρίζουν καλύτερα από όσο γνωρίζουμε εμείς τον εαυτό μας, και αυτό δεν είναι πάντα παρηγορητικό.","c":"Για τη μοναξιά και τις σχέσεις","th":3},{"k":"aph","n":"61","t":"Η οικειότητα δεν καταργεί το μυστήριο· μερικές φορές το κάνει πιο βαθύ.","c":"Για τη μοναξιά και τις σχέσεις","th":3},{"k":"aph","n":"62","t":"Η αγάπη δεν σημαίνει ότι γνωρίζεις τον άλλον· σημαίνει ότι αποδέχεσαι πως δεν θα τον γνωρίσεις ποτέ ολοκληρωτικά.","c":"Για τη μοναξιά και τις σχέσεις","th":3},{"k":"aph","n":"63","t":"Η αδιαφορία είναι συχνά πιο σκληρή από το μίσος, επειδή δεν χρειάζεται να σε θεωρεί σημαντικό.","c":"Για τη μοναξιά και τις σχέσεις","th":3},{"k":"aph","n":"64","t":"Μερικές αποστάσεις δεν δημιουργούνται από διαφωνία αλλά από διαφορετικούς τρόπους να αντιλαμβάνεσαι την πραγματικότητα.","c":"Για τη μοναξιά και τις σχέσεις","th":3},{"k":"aph","n":"65","t":"Ο άνθρωπος μπορεί να συγχωρήσει μια πράξη ευκολότερα από την αποκάλυψη του χαρακτήρα που κρυβόταν πίσω της.","c":"Για τη μοναξιά και τις σχέσεις","th":3},{"k":"aph","n":"66","t":"Η εξουσία δεν χρειάζεται πάντα να απαγορεύει· αρκεί μερικές φορές να κάνει μια εναλλακτική σκέψη να φαίνεται αδύνατη.","c":"Για την εξουσία και την κοινωνία","th":3},{"k":"aph","n":"67","t":"Ο άνθρωπος υπακούει ευκολότερα όταν πιστεύει ότι επέλεξε ο ίδιος την εντολή.","c":"Για την εξουσία και την κοινωνία","th":3},{"k":"aph","n":"68","t":"Μια κοινωνία μπορεί να γίνει τόσο συνηθισμένη στην επιτήρηση ώστε να αρχίσει να επιτηρεί μόνη της τον εαυτό της.","c":"Για την εξουσία και την κοινωνία","th":3},{"k":"aph","n":"69","t":"Η πιο αποτελεσματική προπαγάνδα δεν σου λέει τι να πιστέψεις· σου λέει τι δεν αξίζει να αμφισβητήσεις.","c":"Για την εξουσία και την κοινωνία","th":3},{"k":"aph","n":"70","t":"Η εξουσία φοβάται λιγότερο τον θυμό από την ανεξάρτητη σκέψη.","c":"Για την εξουσία και την κοινωνία","th":3},{"k":"aph","n":"71","t":"Όταν όλοι επαναλαμβάνουν την ίδια λέξη, δεν σημαίνει ότι συμφωνούν· μπορεί να σημαίνει ότι φοβούνται να χρησιμοποιήσουν άλλη.","c":"Για την εξουσία και την κοινωνία","th":3},{"k":"aph","n":"72","t":"Ο όχλος μπορεί να δώσει στον άνθρωπο το θάρρος να κάνει όσα μόνος του θα ντρεπόταν να κάνει.","c":"Για την εξουσία και την κοινωνία","th":3},{"k":"aph","n":"73","t":"Η κοινωνική αποδοχή είναι ένα από τα πιο ήσυχα είδη εξουσίας.","c":"Για την εξουσία και την κοινωνία","th":3},{"k":"aph","n":"74","t":"Μερικές φορές η κοινωνία δεν τιμωρεί αυτό που είναι λάθος· τιμωρεί αυτό που είναι διαφορετικό.","c":"Για την εξουσία και την κοινωνία","th":3},{"k":"aph","n":"75","t":"Ο πολιτισμός είναι λεπτότερο περίβλημα απ’ όσο θέλουμε να πιστεύουμε.","c":"Για την εξουσία και την κοινωνία","th":3},{"k":"aph","n":"76","t":"Κάθε τεχνολογία που λύνει ένα πρόβλημα δημιουργεί την πιθανότητα να ξεχάσουμε γιατί υπήρχε το πρόβλημα.","c":"Για την τεχνολογία","th":3},{"k":"aph","n":"77","t":"Η μηχανή μπορεί να μάθει από τα δεδομένα μας χωρίς να μάθει τι σημαίνουν για εμάς.","c":"Για την τεχνολογία","th":3},{"k":"aph","n":"78","t":"Όταν όλα γίνονται ευκολότερα, δεν γίνεται απαραίτητα ευκολότερο να ξέρουμε τι αξίζει.","c":"Για την τεχνολογία","th":3},{"k":"aph","n":"79","t":"Η τεχνολογία πολλαπλασιάζει την ανθρώπινη πρόθεση πριν προλάβει να πολλαπλασιάσει την ανθρώπινη σοφία.","c":"Για την τεχνολογία","th":3},{"k":"aph","n":"80","t":"Μια κοινωνία μπορεί να γίνει τόσο αποτελεσματική ώστε να μην έχει πια χρόνο να αναρωτηθεί αν κινείται προς τη σωστή κατεύθυνση.","c":"Για την τεχνολογία","th":3},{"k":"aph","n":"81","t":"Η πληροφορία μπορεί να φωτίσει την πραγματικότητα ή να δημιουργήσει τόσο θόρυβο ώστε να την κρύψει.","c":"Για την τεχνολογία","th":3},{"k":"aph","n":"82","t":"Όταν μια μηχανή γνωρίζει περισσότερα για εμάς από όσα γνωρίζουμε εμείς για τον εαυτό μας, το πρόβλημα δεν είναι μόνο τεχνολογικό.","c":"Για την τεχνολογία","th":3},{"k":"aph","n":"83","t":"Η τεχνολογία δεν αφαιρεί την ανθρώπινη αδυναμία· συχνά της δίνει μεγαλύτερη εμβέλεια.","c":"Για την τεχνολογία","th":3},{"k":"aph","n":"84","t":"Το πιο παράξενο μέλλον ίσως δεν είναι εκείνο όπου οι μηχανές θα μοιάζουν με ανθρώπους, αλλά εκείνο όπου οι άνθρωποι θα μοιάζουν με τα συστήματα που δημιούργησαν.","c":"Για την τεχνολογία","th":3},{"k":"aph","n":"85","t":"Δεν είναι βέβαιο ότι η έξυπνη μηχανή θα γίνει άνθρωπος· είναι όμως βέβαιο ότι ο άνθρωπος θα χρειαστεί να ξαναορίσει τι σημαίνει άνθρωπος.","c":"Για την τεχνολογία","th":3},{"k":"aph","n":"86","t":"Το Σύμπαν μπορεί να είναι γεμάτο ζωή και να παραμένει σιωπηλό για λόγους που δεν μπορούμε ακόμη να φανταστούμε.","c":"Για το Σύμπαν και το άγνωστο","th":3},{"k":"aph","n":"87","t":"Το ότι δεν ακούμε κανέναν δεν σημαίνει ότι κανείς δεν υπάρχει· μπορεί να σημαίνει ότι δεν ξέρουμε πώς να ακούσουμε.","c":"Για το Σύμπαν και το άγνωστο","th":3},{"k":"aph","n":"88","t":"Ίσως η μεγαλύτερη κοσμική μας αυταπάτη να είναι ότι ό,τι δεν καταλαβαίνουμε πρέπει να μοιάζει με ό,τι ήδη γνωρίζουμε.","c":"Για το Σύμπαν και το άγνωστο","th":3},{"k":"aph","n":"89","t":"Αν υπάρχει ζωή αλλού, δεν θα μειώσει την αξία μας· θα μειώσει την ψευδαίσθηση της μοναδικότητάς μας.","c":"Για το Σύμπαν και το άγνωστο","th":3},{"k":"aph","n":"90","t":"Αν είμαστε μόνοι, η σιωπή του Σύμπαντος δεν είναι απάντηση· είναι συνθήκη.","c":"Για το Σύμπαν και το άγνωστο","th":3},{"k":"aph","n":"91","t":"Τα άστρα δεν μας κοιτούν, αλλά η ανάγκη μας να τα κοιτάζουμε λέει κάτι βαθύ για εμάς.","c":"Για το Σύμπαν και το άγνωστο","th":3},{"k":"aph","n":"92","t":"Ίσως το Σύμπαν να μην έχει σκοπό· αυτό δεν σημαίνει ότι η ζωή δεν μπορεί να έχει κατεύθυνση.","c":"Για το Σύμπαν και το άγνωστο","th":3},{"k":"aph","n":"93","t":"Το άγνωστο δεν είναι απαραίτητα απειλή· είναι απλώς το μέρος της πραγματικότητας όπου οι βεβαιότητές μας χάνουν τη δύναμή τους.","c":"Για το Σύμπαν και το άγνωστο","th":3},{"k":"aph","n":"94","t":"Μπορεί να υπάρχουν ερωτήματα που δεν θα απαντήσουμε ποτέ· αυτό δεν τα κάνει λιγότερο σημαντικά.","c":"Για το Σύμπαν και το άγνωστο","th":3},{"k":"aph","n":"95","t":"Η σιωπή του Σύμπαντος είναι φιλοσοφικά πιο έντιμη από πολλές ανθρώπινες απαντήσεις.","c":"Για το Σύμπαν και το άγνωστο","th":3},{"k":"aph","n":"96","t":"Το νόημα δεν βρίσκεται πάντοτε κάπου· μερικές φορές βρίσκεται στον τρόπο που στεκόμαστε απέναντι σε αυτό που δεν έχει απάντηση.","c":"Για το νόημα","th":3},{"k":"aph","n":"97","t":"Η ζωή δεν χρειάζεται να έχει κοσμικό σχέδιο για να έχει πραγματικές συνέπειες.","c":"Για το νόημα","th":3},{"k":"aph","n":"98","t":"Μπορεί να μην υπάρχει τελικός σκοπός, αλλά υπάρχει πάντοτε το επόμενο αποτέλεσμα των πράξεών μας.","c":"Για το νόημα","th":3},{"k":"aph","n":"99","t":"Το γεγονός ότι όλα τελειώνουν δεν κάνει τα πάντα μάταια· κάνει κάθε επιλογή χρονικά περιορισμένη.","c":"Για το νόημα","th":3},{"k":"aph","n":"100","t":"Ίσως το βαθύτερο σκοτάδι δεν είναι ότι δεν υπάρχει απάντηση, αλλά ότι πρέπει να ζήσουμε πριν μάθουμε αν υπάρχει.","c":"Για το νόημα","th":3}],P=[{"name":"Ο άνθρωπος ανάμεσα στη φύση, τη γλώσσα και το άγνωστο","start":0,"th":0},{"name":"1. Ο πραγματισμός και η αλήθεια που δοκιμάζεται στη ζωή","start":9,"th":0},{"name":"2. Η ηθική αρχίζει όταν η δύναμη μεγαλώνει","start":19,"th":0},{"name":"3. Η γλώσσα δεν περιγράφει απλώς τον κόσμο","start":27,"th":0},{"name":"4. Η φύση δεν είναι σκηνικό","start":36,"th":0},{"name":"5. Είμαστε μόνοι στο Σύμπαν;","start":44,"th":0},{"name":"6. Το παράδοξο του πολιτισμού","start":52,"th":0},{"name":"7. Η τεχνητή νοημοσύνη και το νέο φιλοσοφικό πρόβλημα","start":57,"th":0},{"name":"8. Μπορεί η φύση να έχει μορφές νοημοσύνης που δεν αναγνωρίζουμε;","start":63,"th":0},{"name":"9. Πραγματισμός χωρίς κυνισμό","start":68,"th":0},{"name":"10. Η πραγματική πρόοδος","start":73,"th":0},{"name":"11. Ίσως το μεγαλύτερο επίτευγμα να είναι η συνύπαρξη","start":78,"th":0},{"name":"12. Και αν είμαστε πράγματι μόνοι;","start":83,"th":0},{"name":"13. Η φιλοσοφία ως τρόπος ζωής","start":89,"th":0},{"name":"100 πραγματιστικοί φιλοσοφικοί αφορισμοί","start":98,"th":1},{"name":"100 σκληροί και φιλοσοφικά βαθιοί αφορισμοί","start":199,"th":2},{"name":"100 σκοτεινοί φιλοσοφικοί αφορισμοί","start":300,"th":3}],G={"\u03b1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHgAAAB4CAIAAAC2BqGFAAAR8ElEQVR42u1dS4vkVBS+9yapSnXrIDgqbkYRRcGRWbhU0LV7EcQ/4B8S/4C6cCG6EcGtgjADItID4gOmmxlGupXpbrsqSSVx8U1/c+bcm3QqVZ0p7bqLJlTndc899zvvE2utNWLUdW06D1670FXdb9vxxeT5HU/rMYJ3bronT+YJdhlCD0/T1V4+5Lyc2YxBxobQG0JvCL0ZG0JvCH3hx1KqZXft6kx9s9+zlh+D6YIbjt5Ax4bQm7Eh9IbQG0JvSDDMiBfVrqQ+5JwzxpRliWNrLY59bSzoI+yiWgWf2+6ejaKoqiqcU1WVc66qKnVPa636cV0IHRx4V0yprmtMW9L0IW+s+B2EUFPtrtK2n1lVVfsJj8SPantzNPnCORfH8Xw+r6oqSRKSD5fIvz47827tk29iQK6xomMcx9baoiiiKJL7TJ1prR2M6P052lqbpunJyUlVVZIK5Ou6rlvMOcn+PBM/Ouf8+QOmglwp9w3+lSTJfD6Posg5N5/P4ziu63o+n/tTGIzQUQ/6EgeKosCxJK4fxcExKCWJ4rMz2dwH8fZ4FV+Jp5GsuBuZWi3YfwCj67re3t6+evXq008/nee5MQYAkiSJnDYmpliek+exT2WFPDzgreq6losnwc1aO5vNRqMRLpxOpzs7O/v7+4Bv5xzp/h8gtLX2+eeff//99994440sy6qqmkwm8/ncOcf5k9CKoJgw//pczGsVofFfXiKZlGeWZZkkSZ7nELnb29u//fbb var AC=['#8fc1b5','#8fc1b5','#d49267','#a698dc'];
var U=G;
var $=function(i){return document.getElementById(i)},cur=0;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function segs(s){var r=[],re=/\*\*(.+?)\*\*|\*(.+?)\*/g,p=0,m;
while((m=re.exec(s))){if(m.index>p)r.push([s.slice(p,m.index),0]);r.push([m[1]||m[2],m[1]?1:2]);p=re.lastIndex}
if(p<s.length)r.push([s.slice(p),0]);return r}
function greek(s){return segs(s).map(function(x){var t=esc(x[0]);return x[1]==1?'<b>'+t+'</b>':x[1]==2?'<i>'+t+'</i>':t}).join('')}
function cipher(s){var h='',w='';
function end(){if(w){h+='<span class="w">'+w+'</span>';w=''}}
segs(s).forEach(function(x){x[0].split('').forEach(function(c){
if(/\s/.test(c)){end();return}
var n=c.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(n=='ς')n='σ';
if(U[n])w+='<img src="'+U[n]+'" alt="">';else w+='<span class="pu">'+esc(c)+'</span>'})});
end();return h}
function both(s,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'><span class="gr">'+greek(s)+'</span><span class="ci">'+cipher(s)+'</span></'+tag+'>'}
function size(n){return n<=70?1:n<=130?2:n<=200?3:4}
function render(i){var s=S[i],h='';
if(s.k=='title')h='<div class="slide k-title">'+both(s.t,'h1')+'<p class="sub">Στοχασμοί · 3 × 100 αφορισμοί</p></div>';
else if(s.k=='sec')h='<div class="slide k-sec"><div class="n">'+s.n+'</div>'+both(s.t,'h2')+'</div>';
else if(s.k=='coll')h='<div class="slide k-coll">'+both(s.t,'h2')+'</div>';
else if(s.k=='aph')h='<div class="slide k-aph sz'+size(s.t.length)+'"><div class="meta"><span>'+esc(s.c)+'</span><span>'+s.n+' / 100</span></div>'+both(s.t,'p','q')+'</div>';
else{var n=s.ls.reduce(function(a,l){return a+l.replace(/\*/g,'').length},0);
h='<div class="slide k-text sz'+size(n)+'">'+s.ls.map(function(l){return both(l,'p',/^\*\*.+\*\*$/.test(l)?'b':'')}).join('')+'</div>'}
$('stage').innerHTML=h}
function partOf(i){var p=0;for(var j=0;j<P.length;j++)if(P[j].start<=i)p=j;return p}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));var s=S[cur];render(cur);
document.documentElement.style.setProperty('--ac',AC[s.th||0]);
$('l1').textContent=s.k=='title'?'':(s.k=='text'?s.l:P[partOf(cur)].name);
$('l2').textContent=(cur+1)+' / '+S.length;
var a=cur/(S.length-1||1)*2*Math.PI-Math.PI/2;$('pl').setAttribute('cx',50+44*Math.cos(a));$('pl').setAttribute('cy',50+44*Math.sin(a));
try{history.replaceState(null,'','#'+(cur+1))}catch(e){}
Array.prototype.forEach.call($('il').children,function(li,j){li.className=j==partOf(cur)?'cur':''})}
function mode(m){document.body.dataset.mode=m;Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){b.classList.toggle('on',b.dataset.m==m)})}
document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){mode(b.dataset.m)}});
$('bp').onclick=function(){go(cur-1)};$('bn').onclick=function(){go(cur+1)};
function fs(){try{var r=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(function(){})}catch(e){}}
$('bf').onclick=fs;
function idx(o){$('idx').classList.toggle('open',o)}
$('bi').onclick=function(){idx(!$('idx').classList.contains('open'))};
$('idx').onclick=function(e){if(e.target==this)idx(false)};
P.forEach(function(p,j){var n=(P[j+1]?P[j+1].start:S.length)-p.start,li=document.createElement('li');
li.innerHTML='<button>'+esc(p.name)+'<span>'+n+'</span></button>';
li.firstChild.onclick=function(){idx(false);go(p.start)};$('il').appendChild(li)});
var ms=['greek','cipher','both'];
document.addEventListener('keydown',function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;var k=e.key;
if(k==' '){e.preventDefault();setPlay(!playing)}
else if(k=='ArrowRight'||k=='PageDown'){e.preventDefault();go(cur+1)}
else if(k=='ArrowLeft'||k=='PageUp'){e.preventDefault();go(cur-1)}
else if(k=='Home')go(0);else if(k=='End')go(S.length-1);
else if(k=='c'||k=='C')mode(ms[(ms.indexOf(document.body.dataset.mode)+1)%3]);
else if(k=='g'||k=='G')idx(!$('idx').classList.contains('open'));
else if(k=='f'||k=='F')fs();else if(k=='Escape')idx(false)});
var tx=0;document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60)go(cur+(d<0?1:-1))},{passive:true});
var playing=true,timer=null;
function dur(){var s=S[cur];if(s.k=='title')return 6000;if(s.k=='sec'||s.k=='coll')return 4500;
var n=s.k=='aph'?s.t.length:s.ls.join('').length;return Math.max(5000,3500+n*55)}
function sched(){clearTimeout(timer);if(playing&&!document.hidden)timer=setTimeout(function(){go(cur+1>=S.length?0:cur+1)},dur())}
function setPlay(p){playing=p;$('bpl').textContent=p?'⏸':'▶';sched()}
$('bpl').onclick=function(){setPlay(!playing)};
document.addEventListener('visibilitychange',sched);
var _go=go;go=function(i){_go(i);sched()};
$('bp').onclick=function(){go(cur-1)};$('bn').onclick=function(){go(cur+1>=S.length?0:cur+1)};
var h0=1;try{h0=parseInt(location.hash.slice(1))||1}catch(e){}go(h0-1);
</script>
